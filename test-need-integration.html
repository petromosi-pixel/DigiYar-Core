<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تست Need Integration — V4</title>

  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .build {
      color: #666;
      margin-bottom: 25px;
    }

    .summary {
      padding: 15px;
      background: white;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .pass {
      color: green;
    }

    .fail {
      color: red;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f1f1f1;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>تست Need Integration — V4</h1>
  <div class="build">Build 5 — Alpha 1</div>

  <div id="summary" class="summary">
    در حال اجرای تست‌ها...
  </div>

  <div id="results"></div>

</div>

<!--
  فایل موتور اصلی Integration
  توجه:
  test در ریشه است
  موتور داخل js قرار دارد
-->
<script src="./js/need-integration.js"></script>

<script>

(function () {

  const results = [];

  function pass(name, condition, actual) {

    results.push({
      name,
      passed: condition,
      actual
    });

  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  /*
   * Scenario 1
   * اضافه شدن بودجه بدون از بین رفتن دسته
   */
  {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: null,
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["budget", "usage"],
      confidence: 0.34,
      ready: false,
      nextAction: "ask_user"
    };

    const answer = {
      version: "4.0.0-alpha.1",
      questionId: "budget",
      understood: true,
      type: "budget",
      value: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      confidence: 0.98
    };

    const result =
      window.DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    pass(
      "سناریو ۱ — اضافه شدن بودجه بدون از بین رفتن دسته",
      result.category === "mobile" &&
      result.budget &&
      result.budget.max === 15000000 &&
      !result.unknown.includes("budget"),
      result
    );
  }

  /*
   * Scenario 2
   * اضافه شدن کاربرد
   */
  {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["usage"],
      confidence: 0.67,
      ready: false,
      nextAction: "ask_user"
    };

    const answer = {
      version: "4.0.0-alpha.1",
      questionId: "usage",
      understood: true,
      type: "usage",
      value: ["photography"],
      confidence: 0.95
    };

    const result =
      window.DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    pass(
      "سناریو ۲ — اضافه شدن کاربرد",
      result.category === "mobile" &&
      result.budget &&
      result.budget.max === 15000000 &&
      result.usage.includes("photography") &&
      !result.unknown.includes("usage"),
      result
    );
  }

  /*
   * Scenario 3
   * تکمیل کامل نیاز
   */
  {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: null,
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["budget", "usage"],
      confidence: 0.34,
      ready: false,
      nextAction: "ask_user"
    };

    const budgetAnswer = {
      questionId: "budget",
      understood: true,
      type: "budget",
      value: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      confidence: 0.98
    };

    const usageAnswer = {
      questionId: "usage",
      understood: true,
      type: "usage",
      value: ["photography"],
      confidence: 0.95
    };

    const afterBudget =
      window.DigiyarNeedIntegration.integrate(
        need,
        budgetAnswer
      );

    const finalResult =
      window.DigiyarNeedIntegration.integrate(
        afterBudget,
        usageAnswer
      );

    pass(
      "سناریو ۳ — تکمیل کامل نیاز",
      finalResult.category === "mobile" &&
      finalResult.budget &&
      finalResult.budget.max === 15000000 &&
      finalResult.usage.includes("photography") &&
      finalResult.unknown.length === 0 &&
      finalResult.ready === true &&
      finalResult.nextAction === "retrieve_products",
      finalResult
    );
  }

  /*
   * Scenario 4
   * پاسخ نامفهوم نباید اطلاعات قبلی را خراب کند
   */
  {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["usage"],
      confidence: 0.67,
      ready: false,
      nextAction: "ask_user"
    };

    const before = clone(need);

    const unclearAnswer = {
      questionId: "usage",
      understood: false,
      type: "usage",
      value: null,
      confidence: 0
    };

    const result =
      window.DigiyarNeedIntegration.integrate(
        need,
        unclearAnswer
      );

    pass(
      "سناریو ۴ — پاسخ نامفهوم",
      result.category === before.category &&
      result.budget.max === before.budget.max &&
      result.usage.length === before.usage.length &&
      result.ready === false &&
      result.unknown.includes("usage"),
      result
    );
  }

  /*
   * Scenario 5
   * حفظ اطلاعات قبلی
   */
  {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      usage: ["photography"],
      decisionElements: [
        {
          field: "camera",
          type: "requirement",
          importance: 8,
          source: "declared",
          confidence: 0.9
        }
      ],
      tradeoffs: [],
      unknown: [],
      confidence: 1,
      ready: true,
      nextAction: "retrieve_products"
    };

    const answer = {
      questionId: "budget",
      understood: true,
      type: "budget",
      value: {
        min: null,
        max: 20000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      confidence: 0.98
    };

    const result =
      window.DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    pass(
      "سناریو ۵ — حفظ اطلاعات قبلی",
      result.category === "mobile" &&
      result.budget.max === 20000000 &&
      result.usage.includes("photography") &&
      result.decisionElements.length === 1 &&
      result.decisionElements[0].field === "camera" &&
      result.ready === true,
      result
    );
  }

  /*
   * Render
   */

  const passed =
    results.filter(item => item.passed).length;

  const total = results.length;

  const summary =
    document.getElementById("summary");

  summary.innerHTML =
    passed === total
      ? `<span class="pass">🎉 ALL TESTS PASSED — ${passed} از ${total}</span>`
      : `<span class="fail">⚠️ SOME TESTS FAILED — ${passed} از ${total}</span>`;

  const resultsContainer =
    document.getElementById("results");

  results.forEach((item, index) => {

    const div =
      document.createElement("div");

    div.className = "test";

    div.innerHTML = `
      <h3>
        ${item.passed ? "✅ PASS" : "❌ FAIL"}
        — سناریو ${index + 1}
      </h3>

      <strong>${item.name}</strong>

      <pre>${JSON.stringify(
        item.actual,
        null,
        2
      )}</pre>
    `;

    resultsContainer.appendChild(div);

  });

})();

</script>

</body>
</html>
