<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست Need Integration — V4</title>

  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .summary {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 18px;
    }

    .all-pass {
      background: #dff6e4;
      color: #176b2c;
    }

    .some-fail {
      background: #ffe2e2;
      color: #9b1c1c;
    }

    .test {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .pass {
      color: #16852d;
      font-weight: bold;
    }

    .fail {
      color: #c62828;
      font-weight: bold;
    }

    pre {
      direction: ltr;
      text-align: left;
      background: #f1f3f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>تست Need Integration — V4</h1>
  <div class="subtitle">Build 5 — Alpha 1</div>

  <div id="summary" class="summary">
    در حال اجرای تست‌ها...
  </div>

  <div id="results"></div>

</div>

<script src="./need-integration.js"></script>

<script>

const results = [];

function deepEqual(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function runTest(name, testFunction) {

  try {

    const result = testFunction();

    results.push({
      name,
      pass: result.pass,
      output: result.output
    });

  } catch (error) {

    results.push({
      name,
      pass: false,
      output: {
        error: error.message
      }
    });
  }
}


/* =========================================================
   سناریو ۱
   اضافه شدن بودجه به Need موجود
========================================================= */

runTest(
  "سناریو ۱ — اضافه شدن بودجه بدون از بین رفتن دسته",
  () => {

    const need = {
      version: "4.0.0-alpha.3",
      input: "یه گوشی خوب می‌خوام.",
      category: "mobile",
      intent: "purchase",
      budget: null,
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["budget", "usage"],
      confidence: 0.34,
      ready: false,
      nextAction: "ask_user"
    };

    const answer = {
      questionId: "budget",
      understood: true,
      type: "budget",
      value: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      confidence: 0.98
    };

    const output =
      DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    const pass =
      output.category === "mobile" &&
      output.budget.max === 15000000 &&
      output.unknown.includes("usage") &&
      !output.unknown.includes("budget") &&
      output.ready === false;

    return { pass, output };
  }
);


/* =========================================================
   سناریو ۲
   اضافه شدن کاربرد
========================================================= */

runTest(
  "سناریو ۲ — اضافه شدن کاربرد",
  () => {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["usage"],
      confidence: 0.67,
      ready: false,
      nextAction: "ask_user"
    };

    const answer = {
      questionId: "usage",
      understood: true,
      type: "usage",
      value: ["photography"],
      confidence: 0.95
    };

    const output =
      DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    const pass =
      output.category === "mobile" &&
      output.budget.max === 15000000 &&
      output.usage.includes("photography") &&
      output.unknown.length === 0 &&
      output.ready === true &&
      output.nextAction === "retrieve_products";

    return { pass, output };
  }
);


/* =========================================================
   سناریو ۳
   تکمیل کامل Need
========================================================= */

runTest(
  "سناریو ۳ — تکمیل کامل نیاز",
  () => {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["usage"],
      confidence: 0.67,
      ready: false,
      nextAction: "ask_user"
    };

    const answer = {
      questionId: "usage",
      understood: true,
      type: "usage",
      value: ["photography"],
      confidence: 0.95
    };

    const output =
      DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    const pass =
      output.ready === true &&
      output.nextAction === "retrieve_products" &&
      output.unknown.length === 0 &&
      output.category === "mobile" &&
      output.budget.max === 15000000 &&
      output.usage[0] === "photography";

    return { pass, output };
  }
);


/* =========================================================
   سناریو ۴
   پاسخ نامفهوم نباید Need را خراب کند
========================================================= */

runTest(
  "سناریو ۴ — پاسخ نامفهوم",
  () => {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      usage: [],
      decisionElements: [],
      tradeoffs: [],
      unknown: ["usage"],
      confidence: 0.67,
      ready: false,
      nextAction: "ask_user"
    };

    const answer = {
      questionId: "usage",
      understood: false,
      type: "usage",
      value: null,
      confidence: 0
    };

    const output =
      DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    const pass =
      output.category === "mobile" &&
      output.budget.max === 15000000 &&
      output.usage.length === 0 &&
      output.unknown.includes("usage") &&
      output.ready === false;

    return { pass, output };
  }
);


/* =========================================================
   سناریو ۵
   اطلاعات قبلی نباید حذف شوند
========================================================= */

runTest(
  "سناریو ۵ — حفظ اطلاعات قبلی",
  () => {

    const need = {
      version: "4.0.0-alpha.3",
      category: "mobile",
      intent: "purchase",
      budget: {
        min: null,
        max: 15000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      usage: ["photography"],
      decisionElements: [
        {
          field: "camera",
          type: "requirement",
          importance: 8
        }
      ],
      tradeoffs: [],
      unknown: [],
      confidence: 1,
      ready: true,
      nextAction: "retrieve_products"
    };

    const answer = {
      questionId: "budget",
      understood: true,
      type: "budget",
      value: {
        min: null,
        max: 14000000,
        type: "hard_constraint",
        source: "declared",
        confidence: 0.98
      },
      confidence: 0.98
    };

    const output =
      DigiyarNeedIntegration.integrate(
        need,
        answer
      );

    const pass =
      output.category === "mobile" &&
      output.budget.max === 14000000 &&
      output.usage.includes("photography") &&
      output.decisionElements.length === 1 &&
      output.decisionElements[0].field === "camera" &&
      output.ready === true;

    return { pass, output };
  }
);


/* =========================================================
   نمایش نتایج
========================================================= */

const resultsContainer =
  document.getElementById("results");

let passed = 0;

results.forEach((test, index) => {

  if (test.pass) passed++;

  const div =
    document.createElement("div");

  div.className = "test";

  div.innerHTML = `
    <div class="${test.pass ? "pass" : "fail"}">
      ${test.pass ? "✅ PASS" : "❌ FAIL"}
    </div>

    <h3>${test.name}</h3>

    <pre>${JSON.stringify(
      test.output,
      null,
      2
    )}</pre>
  `;

  resultsContainer.appendChild(div);
});

const summary =
  document.getElementById("summary");

if (passed === results.length) {

  summary.className =
    "summary all-pass";

  summary.textContent =
    `🎉 ALL TESTS PASSED — ${passed} از ${results.length}`;

} else {

  summary.className =
    "summary some-fail";

  summary.textContent =
    `⚠️ SOME TESTS FAILED — ${passed} از ${results.length}`;
}

</script>

</body>
</html>
