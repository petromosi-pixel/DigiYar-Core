<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تست موتور نیازسنجی دیجی‌یار</title>

    <style>

        body {
            font-family: Tahoma, sans-serif;
            padding: 20px;
            line-height: 2;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
        }

        pre {
            background: #f3f3f3;
            padding: 15px;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
        }

    </style>

</head>


<body>

    <h2>
        تست موتور نیازسنجی دیجی‌یار
    </h2>


    <!-- =========================================
         تست‌های پایه
    ========================================== -->

    <button onclick="testCreateNeed()">
        ۱. ساخت نیاز خرید
    </button>


    <button onclick="testQuestions()">
        ۲. دریافت سؤال‌های گوشی
    </button>


    <button onclick="testAnswers()">
        ۳. ثبت پاسخ‌ها
    </button>


    <button onclick="testCompleteness()">
        ۴. بررسی کامل‌بودن نیاز
    </button>


    <button onclick="testProfileIntegration()">
        ۵. تشخیص اتصال پروفایل + ساخت نیاز
    </button>


    <!-- =========================================
         تست Confidence
    ========================================== -->

    <div class="section">

        <h3>
            تست Confidence
        </h3>

        <button onclick="runConfidenceTests()">
            اجرای ۶ سناریوی Confidence
        </button>

    </div>


    <!-- =========================================
         تست Completeness
    ========================================== -->

    <div class="section">

        <h3>
            تست Completeness
        </h3>

        <button onclick="runCompletenessTests()">
            اجرای ۶ سناریوی Completeness
        </button>

    </div>


    <pre id="result"></pre>


    <!-- =========================================
         فایل‌های اصلی
    ========================================== -->

    <script src="js/user-profile.js"></script>

    <script src="js/need-engine.js?v=1.3.0"></script>


    <script>

        const result =
            document.getElementById("result");


        function show(data) {

            result.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        }


        // =========================================
        // تست ۱
        // =========================================

        function testCreateNeed() {

            const need =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });

            show(need);

        }


        // =========================================
        // تست ۲
        // =========================================

        function testQuestions() {

            const questions =
                DigiyarNeedEngine.getQuestions(
                    "mobile"
                );

            show(questions);

        }


        // =========================================
        // تست ۳
        // =========================================

        function testAnswers() {

            const need =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                need,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "usage",
                "عکاسی"
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "priorities",
                [
                    "دوربین",
                    "باتری",
                    "ارزش خرید"
                ]
            );


            show(need);

        }


        // =========================================
        // تست ۴
        // =========================================

        function testCompleteness() {

            const need =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                need,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "usage",
                "عکاسی"
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "priorities",
                [
                    "دوربین",
                    "باتری"
                ]
            );


            show({

                completeness:
                    DigiyarNeedEngine
                        .getCompleteness(
                            need
                        ),

                ready:
                    DigiyarNeedEngine
                        .isReady(
                            need
                        ),

                need:
                    need

            });

        }


        // =========================================
        // تست ۵
        // =========================================

        function testProfileIntegration() {

            const diagnostics = {

                userProfileExists:
                    typeof DigiyarUserProfile !==
                    "undefined",

                getProfileExists:
                    typeof DigiyarUserProfile !==
                    "undefined" &&
                    typeof DigiyarUserProfile
                        .getProfile ===
                        "function",

                needEngineExists:
                    typeof DigiyarNeedEngine !==
                    "undefined",

                buildNeedFromProfileExists:
                    typeof DigiyarNeedEngine !==
                    "undefined" &&
                    typeof DigiyarNeedEngine
                        .buildNeedFromProfile ===
                        "function"

            };


            if (
                !diagnostics.userProfileExists
            ) {

                show({

                    error:
                        "DigiyarUserProfile پیدا نشد.",

                    diagnostics:
                        diagnostics

                });

                return;

            }


            const profile =
                DigiyarUserProfile
                    .getProfile();


            let need;


            try {

                need =
                    DigiyarNeedEngine
                        .buildNeedFromProfile(
                            "mobile"
                        );

            } catch (error) {

                show({

                    error:
                        "buildNeedFromProfile با خطا مواجه شد.",

                    message:
                        error.message,

                    profile:
                        profile

                });

                return;

            }


            show({

                diagnostics:
                    diagnostics,

                profile:
                    profile,

                generatedNeed:
                    need

            });

        }


        // =========================================
        // تست Confidence
        // =========================================

        function runConfidenceTests() {

            const results = [];


            // --------------------------------------
            // ۱. خالی
            // --------------------------------------

            const emptyNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            results.push({

                scenario:
                    "۱. پروفایل خالی",

                confidence:
                    emptyNeed.confidence

            });


            // --------------------------------------
            // ۲. فقط بودجه
            // --------------------------------------

            const budgetNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                budgetNeed,
                "budget",
                15000000
            );


            results.push({

                scenario:
                    "۲. فقط بودجه",

                confidence:
                    budgetNeed.confidence

            });


            // --------------------------------------
            // ۳. فقط اولویت
            // --------------------------------------

            const priorityNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                priorityNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            results.push({

                scenario:
                    "۳. فقط اولویت",

                confidence:
                    priorityNeed.confidence

            });


            // --------------------------------------
            // ۴. بودجه + اولویت
            // --------------------------------------

            const budgetPriorityNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                budgetPriorityNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                budgetPriorityNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            results.push({

                scenario:
                    "۴. بودجه + اولویت",

                confidence:
                    budgetPriorityNeed.confidence

            });


            // --------------------------------------
            // ۵. بودجه + اولویت + کاربرد
            // --------------------------------------

            const detailedNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "usage",
                "عکاسی"
            );


            results.push({

                scenario:
                    "۵. بودجه + اولویت + کاربرد",

                confidence:
                    detailedNeed.confidence

            });


            // --------------------------------------
            // ۶. کامل
            // --------------------------------------

            const fullNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "priorities",
                [
                    "دوربین",
                    "باتری"
                ]
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "usage",
                "عکاسی"
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "requirements",
                "5G"
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "constraints",
                "وزن کم"
            );


            results.push({

                scenario:
                    "۶. اطلاعات کامل",

                confidence:
                    fullNeed.confidence

            });


            show({

                type:
                    "confidence-tests",

                results:
                    results

            });

        }


        // =========================================
        // تست Completeness
        // =========================================

        function runCompletenessTests() {

            const results = [];


            function evaluate(
                scenario,
                need
            ) {

                const completeness =
                    DigiyarNeedEngine
                        .getCompleteness(
                            need
                        );


                const ready =
                    DigiyarNeedEngine
                        .isReady(
                            need
                        );


                results.push({

                    scenario:
                        scenario,

                    confidence:
                        need.confidence,

                    completeness:
                        completeness,

                    isReady:
                        ready,

                    need:
                        need

                });

            }


            // --------------------------------------
            // ۱. خالی
            // --------------------------------------

            const emptyNeed =
                DigiyarNeedEngine.createNeed({
                    category: null
                });


            evaluate(
                "۱. نیاز کاملاً خالی",
                emptyNeed
            );


            // --------------------------------------
            // ۲. فقط بودجه
            // --------------------------------------

            const budgetNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                budgetNeed,
                "budget",
                15000000
            );


            evaluate(
                "۲. فقط بودجه",
                budgetNeed
            );


            // --------------------------------------
            // ۳. فقط اولویت
            // --------------------------------------

            const priorityNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                priorityNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            evaluate(
                "۳. فقط اولویت",
                priorityNeed
            );


            // --------------------------------------
            // ۴. بودجه + اولویت
            // --------------------------------------

            const budgetPriorityNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                budgetPriorityNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                budgetPriorityNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            evaluate(
                "۴. بودجه + اولویت",
                budgetPriorityNeed
            );


            // --------------------------------------
            // ۵. بودجه + اولویت + کاربرد
            // --------------------------------------

            const detailedNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "usage",
                "عکاسی"
            );


            evaluate(
                "۵. بودجه + اولویت + کاربرد",
                detailedNeed
            );


            // --------------------------------------
            // ۶. اطلاعات کامل
            // --------------------------------------

            const fullNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "priorities",
                [
                    "دوربین",
                    "باتری"
                ]
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "usage",
                "عکاسی"
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "requirements",
                "5G"
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "constraints",
                "وزن کم"
            );


            evaluate(
                "۶. اطلاعات کامل",
                fullNeed
            );


            // --------------------------------------
            // خلاصه
            // --------------------------------------

            show({

                type:
                    "completeness-tests",

                results:
                    results

            });

        }

    </script>

</body>

</html>
