<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تست موتور نیازسنجی دیجی‌یار</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            padding: 20px;
            line-height: 2;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
        }

        pre {
            background: #f3f3f3;
            padding: 15px;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h2>تست موتور نیازسنجی دیجی‌یار</h2>


    <!-- =========================================
         تست‌های پایه
    ========================================== -->

    <button onclick="testCreateNeed()">
        ۱. ساخت نیاز خرید
    </button>

    <button onclick="testQuestions()">
        ۲. دریافت سؤال‌های گوشی
    </button>

    <button onclick="testAnswers()">
        ۳. ثبت پاسخ‌ها
    </button>

    <button onclick="testCompleteness()">
        ۴. بررسی کامل‌بودن نیاز
    </button>

    <button onclick="testProfileIntegration()">
        ۵. تشخیص اتصال پروفایل + ساخت نیاز
    </button>


    <!-- =========================================
         تست فشار Confidence
    ========================================== -->

    <div class="section">

        <h3>
            تست فشار موتور نیازسنجی
        </h3>

        <button onclick="runConfidenceTests()">
            اجرای ۶ سناریوی Confidence
        </button>

    </div>


    <pre id="result"></pre>


    <!-- =========================================
         فایل‌های اصلی
    ========================================== -->

    <script src="js/user-profile.js"></script>
    <script src="js/need-engine.js?v=1.2.1"></script>


    <script>

        const result =
            document.getElementById("result");


        function show(data) {

            result.textContent =
                JSON.stringify(data, null, 2);
        }


        // =========================================
        // تست ۱
        // =========================================

        function testCreateNeed() {

            const need =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });

            show(need);
        }


        // =========================================
        // تست ۲
        // =========================================

        function testQuestions() {

            const questions =
                DigiyarNeedEngine.getQuestions("mobile");

            show(questions);
        }


        // =========================================
        // تست ۳
        // =========================================

        function testAnswers() {

            const need =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                need,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "usage",
                "عکاسی"
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "priorities",
                [
                    "دوربین",
                    "باتری",
                    "ارزش خرید"
                ]
            );


            show(need);
        }


        // =========================================
        // تست ۴
        // =========================================

        function testCompleteness() {

            const need =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                need,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "usage",
                "عکاسی"
            );


            DigiyarNeedEngine.addAnswer(
                need,
                "priorities",
                [
                    "دوربین",
                    "باتری"
                ]
            );


            show({

                completeness:
                    DigiyarNeedEngine
                        .getCompleteness(need),

                ready:
                    DigiyarNeedEngine
                        .isReady(need),

                need: need

            });
        }


        // =========================================
        // تست ۵
        // =========================================

        function testProfileIntegration() {

            const diagnostics = {

                userProfileExists:
                    typeof DigiyarUserProfile !== "undefined",

                getProfileExists:
                    typeof DigiyarUserProfile !== "undefined" &&
                    typeof DigiyarUserProfile.getProfile === "function",

                needEngineExists:
                    typeof DigiyarNeedEngine !== "undefined",

                buildNeedFromProfileExists:
                    typeof DigiyarNeedEngine !== "undefined" &&
                    typeof DigiyarNeedEngine.buildNeedFromProfile === "function"
            };


            if (!diagnostics.userProfileExists) {

                show({
                    error:
                        "DigiyarUserProfile پیدا نشد.",
                    diagnostics:
                        diagnostics
                });

                return;
            }


            const profile =
                DigiyarUserProfile.getProfile();


            let need;

            try {

                need =
                    DigiyarNeedEngine
                        .buildNeedFromProfile(
                            "mobile"
                        );

            } catch (error) {

                show({

                    error:
                        "buildNeedFromProfile با خطا مواجه شد.",

                    message:
                        error.message,

                    profile:
                        profile

                });

                return;
            }


            show({

                diagnostics:
                    diagnostics,

                profile:
                    profile,

                generatedNeed:
                    need

            });
        }


        // =========================================
        // تست فشار Confidence
        // =========================================

        function runConfidenceTests() {

            const results = [];


            // --------------------------------------
            // سناریو ۱
            // پروفایل کاملاً خالی
            // انتظار: 0
            // --------------------------------------

            const emptyNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            emptyNeed.confidence =
                DigiyarNeedEngine
                    .calculateConfidence(
                        emptyNeed
                    );


            results.push({

                scenario:
                    "۱. پروفایل خالی",

                expected:
                    0,

                actual:
                    emptyNeed.confidence,

                passed:
                    emptyNeed.confidence === 0

            });


            // --------------------------------------
            // سناریو ۲
            // فقط بودجه
            // انتظار: 30
            // --------------------------------------

            const budgetNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                budgetNeed,
                "budget",
                15000000
            );


            results.push({

                scenario:
                    "۲. فقط بودجه",

                expected:
                    30,

                actual:
                    budgetNeed.confidence,

                passed:
                    budgetNeed.confidence === 30

            });


            // --------------------------------------
            // سناریو ۳
            // فقط اولویت
            // انتظار: 25
            // --------------------------------------

            const priorityNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                priorityNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            // فقط اولویت را نگه می‌داریم
            results.push({

                scenario:
                    "۳. فقط اولویت",

                expected:
                    25,

                actual:
                    priorityNeed.confidence,

                passed:
                    priorityNeed.confidence === 25

            });


            // --------------------------------------
            // سناریو ۴
            // بودجه + اولویت
            // انتظار: 55
            // --------------------------------------

            const budgetPriorityNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                budgetPriorityNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                budgetPriorityNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            results.push({

                scenario:
                    "۴. بودجه + اولویت",

                expected:
                    55,

                actual:
                    budgetPriorityNeed.confidence,

                passed:
                    budgetPriorityNeed.confidence === 55

            });


            // --------------------------------------
            // سناریو ۵
            // بودجه + اولویت + کاربرد
            // انتظار: 75
            // --------------------------------------

            const detailedNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "priorities",
                [
                    "دوربین"
                ]
            );


            DigiyarNeedEngine.addAnswer(
                detailedNeed,
                "usage",
                "عکاسی"
            );


            results.push({

                scenario:
                    "۵. بودجه + اولویت + کاربرد",

                expected:
                    75,

                actual:
                    detailedNeed.confidence,

                passed:
                    detailedNeed.confidence === 75

            });


            // --------------------------------------
            // سناریو ۶
            // اطلاعات کامل
            // انتظار: 100
            // --------------------------------------

            const fullNeed =
                DigiyarNeedEngine.createNeed({
                    category: "mobile"
                });


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "budget",
                15000000
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "priorities",
                [
                    "دوربین",
                    "باتری"
                ]
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "usage",
                "عکاسی"
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "requirements",
                "5G"
            );


            DigiyarNeedEngine.addAnswer(
                fullNeed,
                "constraints",
                "وزن کم"
            );


            results.push({

                scenario:
                    "۶. اطلاعات کامل",

                expected:
                    100,

                actual:
                    fullNeed.confidence,

                passed:
                    fullNeed.confidence === 100

            });


            // ======================================
            // نتیجه نهایی
            // ======================================

            const passedCount =
                results.filter(
                    item => item.passed
                ).length;


            show({

                summary: {

                    total:
                        results.length,

                    passed:
                        passedCount,

                    failed:
                        results.length -
                        passedCount,

                    allPassed:
                        passedCount ===
                        results.length

                },

                results:
                    results

            });

        }

    </script>

</body>

</html>
