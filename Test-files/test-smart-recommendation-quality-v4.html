<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DigiYar V4 — Smart Recommendation Quality Test
  </title>

  <style>

    body {
      font-family: Tahoma, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #172033;
    }

    .summary {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
      background: white;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c62828;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f0f2f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

  </style>

</head>


<body>

  <h1>
    تست Smart Recommendation Quality — V4
  </h1>

  <p>
    <strong>
      Build 10 — Quality Validation
    </strong>
  </p>

  <div
    id="summary"
    class="summary"
  >
    در حال اجرای تست‌ها...
  </div>

  <div id="results"></div>


  <!-- =====================================================
       Dependencies
       ===================================================== -->

  <script src="./js/product-data.js"></script>

  <script src="./js/product-scoring.js"></script>

  <script src="./js/smart-recommendation-engine.js"></script>


  <script>

    "use strict";


    const results = [];


    /* =====================================================
       Helpers
       ===================================================== */

    function addResult(
      name,
      passed,
      data
    ) {

      results.push({

        name:
          name,

        passed:
          passed,

        data:
          data

      });

    }


    function getProducts() {

      if (
        typeof DigiYarProductData ===
        "undefined"
      ) {

        return [];

      }


      if (
        typeof DigiYarProductData.getAll !==
        "function"
      ) {

        return [];

      }


      return DigiYarProductData.getAll();

    }


    function getEngine() {

      if (
        typeof DigiyarSmartRecommendationEngine ===
        "undefined"
      ) {

        return null;

      }


      return DigiyarSmartRecommendationEngine;

    }


    function createPhotographyNeed() {

      return {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            15000000

        },

        usage: [

          "photography"

        ],

        priorities: [

          "دوربین"

        ],

        requirements: [

          {

            value:
              "دوربین"

          }

        ],

        constraints: [],

        ready:
          true,

        nextAction:
          "retrieve_products"

      };

    }


    function createValueNeed() {

      return {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            15000000

        },

        usage: [],

        priorities: [

          "ارزش خرید"

        ],

        requirements: [],

        constraints: [],

        ready:
          true,

        nextAction:
          "retrieve_products"

      };

    }


    /* =====================================================
       Render
       ===================================================== */

    function renderResults() {

      const container =
        document.getElementById(
          "results"
        );


      container.innerHTML = "";


      results.forEach(
        function (
          test,
          index
        ) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "test";


          div.innerHTML = `

            <h3 class="${
              test.passed
                ? "pass"
                : "fail"
            }">

              ${
                test.passed
                  ? "✅ PASS"
                  : "❌ FAIL"
              }

              — بررسی ${index + 1}

            </h3>


            <strong>
              ${test.name}
            </strong>


            <pre>${JSON.stringify(
              test.data,
              null,
              2
            )}</pre>

          `;


          container.appendChild(
            div
          );

        }
      );


      const passed =
        results.filter(
          function (item) {

            return item.passed;

          }
        ).length;


      const total =
        results.length;


      const summary =
        document.getElementById(
          "summary"
        );


      if (
        passed === total
      ) {

        summary.className =
          "summary pass";


        summary.innerHTML =
          `🎉 ALL QUALITY TESTS PASSED — ${passed} از ${total}`;

      }

      else {

        summary.className =
          "summary fail";


        summary.innerHTML =
          `⚠️ QUALITY TESTS FAILED — ${passed} از ${total}`;

      }

    }


    /* =====================================================
       Test 1
       Dependencies
       ===================================================== */

    try {

      const dependencies = {

        productData:
          typeof DigiYarProductData !==
          "undefined",

        productScoring:
          typeof DigiYarProductScoring !==
          "undefined",

        smartRecommendationEngine:
          typeof DigiyarSmartRecommendationEngine !==
          "undefined"

      };


      const passed =
        Object.values(
          dependencies
        ).every(
          Boolean
        );


      addResult(

        "بررسی کامل بودن Dependencyهای Quality Layer",

        passed,

        dependencies

      );

    }

    catch (error) {

      addResult(

        "بررسی کامل بودن Dependencyهای Quality Layer",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Test 2
       Top Recommendation Quality
       ===================================================== */

    try {

      const engine =
        getEngine();


      const products =
        getProducts();


      const need =
        createPhotographyNeed();


      const result =
        engine
          ? engine.recommend(
              need,
              products
            )
          : null;


      const top =
        result &&
        Array.isArray(
          result.recommendations
        ) &&
        result.recommendations.length
          ? result.recommendations[0]
          : null;


      const passed =

        !!result

        &&

        result.status ===
          "recommendations_ready"

        &&

        !!top

        &&

        top.id ===
          "mobile-002"

        &&

        top.name ===
          "موبایل دوربین‌محور"

        &&

        Number(
          top.score
        ) > 0;


      addResult(

        "کیفیت انتخاب محصول اول برای نیاز دوربین‌محور",

        passed,

        {

          status:
            result
              ? result.status
              : null,

          topProduct:
            top,

          expected:
            "mobile-002"

        }

      );

    }

    catch (error) {

      addResult(

        "کیفیت انتخاب محصول اول برای نیاز دوربین‌محور",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Test 3
       Budget Quality
       ===================================================== */

    try {

      const engine =
        getEngine();


      const products =
        getProducts();


      const need =
        createPhotographyNeed();


      const result =
        engine
          ? engine.recommend(
              need,
              products
            )
          : null;


      const recommendations =
        result &&
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const maxBudget =
        15000000;


      const allInsideBudget =
        recommendations.every(
          function (item) {

            return (

              item &&

              item.price !==
                undefined &&

              Number(
                item.price
              ) <=
                maxBudget

            );

          }
        );


      const passed =

        recommendations.length >
          0

        &&

        allInsideBudget;


      addResult(

        "رعایت بودجه کاربر در تمام پیشنهادها",

        passed,

        {

          maxBudget:
            maxBudget,

          recommendationCount:
            recommendations.length,

          allInsideBudget:
            allInsideBudget

        }

      );

    }

    catch (error) {

      addResult(

        "رعایت بودجه کاربر در تمام پیشنهادها",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Test 4
       Ranking Quality
       ===================================================== */

    try {

      const engine =
        getEngine();


      const products =
        getProducts();


      const need =
        createPhotographyNeed();


      const result =
        engine
          ? engine.recommend(
              need,
              products
            )
          : null;


      const recommendations =
        result &&
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const first =
        recommendations[0];


      const second =
        recommendations[1];


      const third =
        recommendations[2];


      const passed =

        recommendations.length >=
          3

        &&

        first.rank ===
          1

        &&

        second.rank ===
          2

        &&

        third.rank ===
          3

        &&

        Number(
          first.score
        ) >=
        Number(
          second.score
        )

        &&

        Number(
          second.score
        ) >=
        Number(
          third.score
        );


      addResult(

        "صحت ترتیب رتبه‌بندی بر اساس Score",

        passed,

        {

          ranking:
            recommendations.map(
              function (item) {

                return {

                  rank:
                    item.rank,

                  id:
                    item.id,

                  name:
                    item.name,

                  score:
                    item.score

                };

              }
            )

        }

      );

    }

    catch (error) {

      addResult(

        "صحت ترتیب رتبه‌بندی بر اساس Score",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Test 5
       Recommendation Limit
       ===================================================== */

    try {

      const engine =
        getEngine();


      const products =
        getProducts();


      const need =
        createValueNeed();


      const result =
        engine
          ? engine.recommend(
              need,
              products,
              {
                limit:
                  2
              }
            )
          : null;


      const recommendations =
        result &&
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const passed =

        recommendations.length >
          0

        &&

        recommendations.length <=
          2;


      addResult(

        "رعایت محدودیت تعداد پیشنهادها",

        passed,

        {

          requestedLimit:
            2,

          actualCount:
            recommendations.length,

          recommendations:
            recommendations.map(
              function (item) {

                return {

                  id:
                    item.id,

                  rank:
                    item.rank,

                  score:
                    item.score

                };

              }
            )

        }

      );

    }

    catch (error) {

      addResult(

        "رعایت محدودیت تعداد پیشنهادها",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Test 6
       Explanation Quality
       ===================================================== */

    try {

      const engine =
        getEngine();


      const products =
        getProducts();


      const need =
        createPhotographyNeed();


      const result =
        engine
          ? engine.recommend(
              need,
              products
            )
          : null;


      const top =
        result &&
        Array.isArray(
          result.recommendations
        ) &&
        result.recommendations.length
          ? result.recommendations[0]
          : null;


      const explanation =
        top &&

        engine &&

        typeof engine.explain ===
          "function"

          ? engine.explain(
              top
            )

          : "";


      const passed =

        !!top

        &&

        typeof explanation ===
          "string"

        &&

        explanation.trim().length >
          0;


      addResult(

        "تولید Explanation قابل استفاده برای پیشنهاد",

        passed,

        {

          product:
            top
              ? top.name
              : null,

          explanation:
            explanation

        }

      );

    }

    catch (error) {

      addResult(

        "تولید Explanation قابل استفاده برای پیشنهاد",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Render
       ===================================================== */

    renderResults();

  </script>

</body>

</html>
