<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiYar V4 - Need Understanding Test</title>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      background: #e6123d;
      color: white;
      font-family: inherit;
      cursor: pointer;
    }

    .summary,
    .test {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: #f7f8fa;
    }

    .pass {
      color: #16803c;
      font-weight: bold;
    }

    .fail {
      color: #c62828;
      font-weight: bold;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #eeeeee;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>تست Need Understanding — V4</h1>

  <p>
    Build 1 — Alpha 0.1
  </p>

  <button id="runTests">
    اجرای تست‌ها
  </button>

  <div id="summary"></div>

  <div id="results"></div>

</div>

<script src="js/need-understanding.js"></script>

<script>

(function () {

  "use strict";

  const tests = [

    {
      name: "سناریو ۱ — نیاز کامل موبایل",

      input:
        "یه گوشی تا ۱۵ میلیون برای عکاسی می‌خوام، دوربین و باتری برام مهمه و ترجیحاً سبک باشه.",

      check: function (result) {

        return (
          result.category === "mobile" &&

          result.budget &&
          result.budget.max === 15000000 &&

          result.usage.includes("photography") &&

          result.decisionElements.some(
            x => x.field === "camera"
          ) &&

          result.decisionElements.some(
            x => x.field === "battery"
          ) &&

          result.decisionElements.some(
            x =>
              x.field === "weight" &&
              x.type === "preference"
          ) &&

          result.ready === true
        );

      }
    },


    {
      name: "سناریو ۲ — نیاز ناقص",

      input:
        "یه گوشی خوب می‌خوام.",

      check: function (result) {

        return (
          result.category === "mobile" &&

          result.ready === false &&

          result.nextAction === "ask_user" &&

          result.unknown.includes("budget") &&

          result.unknown.includes("usage")
        );

      }
    },


    {
      name: "سناریو ۳ — محدودیت سخت وزن",

      input:
        "یه گوشی تا ۱۵ میلیون می‌خوام و حتماً زیر ۱۸۰ گرم باشه.",

      check: function (result) {

        return (
          result.budget &&
          result.budget.max === 15000000 &&

          result.decisionElements.some(
            x =>
              x.field === "weight" &&
              x.type === "hard_constraint" &&

              x.threshold &&
              x.threshold.value === 180
          )
        );

      }
    },


    {
      name: "سناریو ۴ — شرط حذف",

      input:
        "یه گوشی تا ۱۵ میلیون می‌خوام، آیفون نمی‌خوام.",

      check: function (result) {

        return (
          result.decisionElements.some(
            x =>
              x.type === "exclusion" &&
              x.value === "iphone"
          )
        );

      }
    },


    {
      name: "سناریو ۵ — Trade-off",

      input:
        "دوربین برام مهم‌تره و باتری هم خوب باشه.",

      check: function (result) {

        return (
          result.tradeoffs.some(
            x =>
              x.preferred === "camera" &&
              x.over === "battery"
          )
        );

      }
    }

  ];


  document
    .getElementById("runTests")
    .addEventListener("click", function () {

      const results =
        document.getElementById("results");

      const summary =
        document.getElementById("summary");

      results.innerHTML = "";

      if (!window.DigiYarNeedUnderstanding) {

        summary.innerHTML =
          '<div class="summary fail">' +
          '❌ موتور Need Understanding بارگذاری نشد.' +
          '</div>';

        return;
      }


      let passed = 0;


      tests.forEach(function (test) {

        let result;
        let success = false;

        try {

          result =
            window
              .DigiYarNeedUnderstanding
              .analyze(test.input);

          success = test.check(result);

        } catch (error) {

          result = {
            error: String(error)
          };

        }


        if (success) {
          passed++;
        }


        const box =
          document.createElement("div");

        box.className = "test";


        box.innerHTML =

          "<h2>" +
          test.name +
          "</h2>" +

          '<div class="' +
          (success ? "pass" : "fail") +
          '">' +

          (success
            ? "✅ PASS"
            : "❌ FAIL") +

          "</div>" +

          "<p><strong>ورودی:</strong> " +
          test.input +
          "</p>" +

          "<pre>" +
          JSON.stringify(
            result,
            null,
            2
          ) +
          "</pre>";


        results.appendChild(box);

      });


      const allPassed =
        passed === tests.length;


      summary.innerHTML =

        '<div class="summary ' +
        (allPassed ? "pass" : "fail") +
        '">' +

        (allPassed
          ? "🎉 ALL TESTS PASSED"
          : "⚠️ SOME TESTS FAILED") +

        " — " +

        passed +

        " از " +

        tests.length +

        "</div>";

    });

})();

</script>

</body>
</html>
