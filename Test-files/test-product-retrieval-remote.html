<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    تست Remote Product Retrieval - دیجی‌یار V3
  </title>

  <style>

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      padding: 20px;
      line-height: 1.8;
    }

    .box {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      box-sizing: border-box;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: #101c35;
      color: #fff;
      font-family: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #f1f2f4;
      margin-bottom: 15px;
    }

    .success {
      background: #e9f8ef;
    }

    .warning {
      background: #fff5df;
    }

    .error {
      background: #fdecec;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f7f8fa;
      border-radius: 12px;
    }

    .test-row {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #fff;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      background: #eef0f3;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .url {
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>
    تست Remote Product Retrieval دیجی‌یار V3
  </h1>

  <p>
    این تست فقط منبع Remote را بررسی می‌کند.
    در صورت شکست، Fallback داخلی اجرا نخواهد شد.
  </p>


  <div class="search-box">

    <input
      id="query"
      type="text"
      value="موبایل"
      placeholder="مثلاً موبایل، لپ تاپ، آیفون"
    >

    <button
      id="runTest"
      type="button"
    >
      اجرای تست Remote
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    آماده اجرای تست
  </div>


  <div id="output"></div>

</div>


<!-- Product Retrieval -->

<script src="js/product-retrieval.js"></script>


<script>

(function () {

  "use strict";


  const queryInput =
    document.getElementById("query");


  const runButton =
    document.getElementById("runTest");


  const status =
    document.getElementById("status");


  const output =
    document.getElementById("output");


  function setStatus(
    message,
    type
  ) {

    status.textContent =
      message;

    status.className =
      "status " +
      (type || "");

  }


  function escapeHTML(value) {

    return String(
      value ?? ""
    ).replace(
      /[&<>"']/g,
      function (character) {

        const entities = {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        };

        return entities[character];

      }
    );

  }


  async function runTest() {

    output.innerHTML = "";

    runButton.disabled = true;


    const query =
      queryInput.value.trim();


    if (!query) {

      setStatus(
        "عبارت جستجو را وارد کن.",
        "warning"
      );

      runButton.disabled = false;

      return;

    }


    if (
      !window.DigiYarProductRetrieval
    ) {

      setStatus(
        "✗ Product Retrieval Layer پیدا نشد.",
        "error"
      );

      runButton.disabled = false;

      return;

    }


    if (
      typeof
        window.DigiYarProductRetrieval.searchRemote !==
        "function"
    ) {

      setStatus(
        "✗ تابع searchRemote پیدا نشد.",
        "error"
      );

      runButton.disabled = false;

      return;

    }


    setStatus(
      "در حال ارتباط مستقیم با منبع Remote...",
      ""
    );


    const startedAt =
      performance.now();


    try {

      const results =
        await window.DigiYarProductRetrieval
          .searchRemote(
            query
          );


      const elapsed =
        Math.round(
          performance.now() -
          startedAt
        );


      if (
        !Array.isArray(results)
      ) {

        setStatus(
          "✗ خروجی Remote آرایه نیست.",
          "error"
        );

        return;

      }


      if (
        results.length
      ) {

        setStatus(
          "✓ Remote Retrieval واقعاً نتیجه برگرداند.",
          "success"
        );

      } else {

        setStatus(
          "⚠ Remote بدون نتیجه برگشت.",
          "warning"
        );

      }


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "result";


      header.innerHTML = `

        <strong>
          عبارت جستجو:
        </strong>

        ${escapeHTML(query)}

        <br>

        <strong>
          تعداد نتایج Remote:
        </strong>

        ${results.length}

        <br>

        <strong>
          زمان پاسخ:
        </strong>

        ${elapsed} ms

      `;


      output.appendChild(
        header
      );


      results.forEach(
        function (product, index) {

          const result =
            document.createElement(
              "div"
            );


          result.className =
            "result";


          result.innerHTML = `

            <h3>
              ${index + 1}.
              ${escapeHTML(
                product.name
              )}
            </h3>

            <div class="test-row">

              <strong>
                ID:
              </strong>

              ${escapeHTML(
                product.id
              )}

            </div>


            <div class="test-row">

              <strong>
                قیمت:
              </strong>

              ${escapeHTML(
                product.price
              )}

            </div>


            <div class="test-row">

              <strong>
                فروشگاه:
              </strong>

              ${escapeHTML(
                product.store
              )}

            </div>


            <div class="test-row">

              <strong>
                Product URL:
              </strong>

              <div class="url">

                ${escapeHTML(
                  product.productUrl ||
                  "ندارد"
                )}

              </div>

            </div>


            <div class="test-row">

              <strong>
                Image:
              </strong>

              <div class="url">

                ${escapeHTML(
                  product.image ||
                  "ندارد"
                )}

              </div>

            </div>


            <div class="test-row">

              <strong>
                Features:
              </strong>

              ${escapeHTML(
                Array.isArray(
                  product.features
                )
                  ? product.features.join("، ")
                  : ""
              )}

            </div>

          `;


          output.appendChild(
            result
          );

        }
      );


      const raw =
        document.createElement(
          "div"
        );


      raw.className =
        "result";


      raw.innerHTML = `

        <h3>
          خروجی خام Remote
        </h3>

        <pre>
${escapeHTML(
  JSON.stringify(
    results,
    null,
    2
  )
)}
        </pre>

      `;


      output.appendChild(
        raw
      );


    } catch (error) {

      console.error(
        "DigiYar Remote Retrieval Test:",
        error
      );


      setStatus(
        "✗ Remote Retrieval با خطا مواجه شد.",
        "error"
      );


      const errorBox =
        document.createElement(
          "div"
        );


      errorBox.className =
        "result";


      errorBox.innerHTML = `

        <strong>
          نوع خطا:
        </strong>

        <div class="test-row">

          ${escapeHTML(
            error &&
            error.name
              ? error.name
              : "UnknownError"
          )}

        </div>


        <strong>
          جزئیات خطا:
        </strong>

        <pre>
${escapeHTML(
  error &&
  error.message
    ? error.message
    : error
)}
        </pre>

      `;


      output.appendChild(
        errorBox
      );

    } finally {

      runButton.disabled =
        false;

    }

  }


  runButton.addEventListener(
    "click",
    runTest
  );


  queryInput.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Enter"
      ) {

        runTest();

      }

    }
  );


})();

</script>

</body>

</html>
