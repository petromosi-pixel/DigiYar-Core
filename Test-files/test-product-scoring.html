<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تست Product Scoring - دیجی‌یار</title>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      padding: 20px;
      line-height: 1.8;
    }

    .box {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #ff8a00;
      color: #fff;
      font-family: inherit;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    .summary {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #f7f8fa;
      font-weight: bold;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c62828;
    }

    .test {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #f7f8fa;
    }

    .test h2 {
      margin-top: 0;
    }

    .status {
      font-weight: bold;
      margin-bottom: 12px;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f1f2f4;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>تست Product Scoring دیجی‌یار</h1>

  <button id="runTest">
    اجرای تست
  </button>

  <div id="summary"></div>

  <div id="output"></div>

</div>


<script src="js/affiliate.js"></script>
<script src="js/product-data.js"></script>
<script src="js/product-scoring.js"></script>


<script>

(function () {

  "use strict";


  const output =
    document.getElementById("output");

  const summary =
    document.getElementById("summary");


  function createNeed(budget) {

    return {

      category: "mobile",

      intent: "purchase",

      budget: {

        min: null,

        max: budget

      },

      priorities: [],

      requirements: [],

      constraints: [],

      context: {

        usage: ""

      }

    };

  }


  function getProduct(
    results,
    name
  ) {

    return results.find(
      function (product) {

        return product.name === name;

      }
    ) || null;

  }


  function addTestResult(
    title,
    passed,
    details
  ) {

    const test =
      document.createElement("div");

    test.className =
      "test";


    const statusClass =
      passed
        ? "pass"
        : "fail";


    const statusText =
      passed
        ? "✓ تست با موفقیت انجام شد"
        : "✗ تست ناموفق بود";


    test.innerHTML = `

      <h2>${title}</h2>

      <div class="status ${statusClass}">
        ${statusText}
      </div>

      <p>
        ${details}
      </p>

    `;


    output.appendChild(test);

  }


  document
    .getElementById("runTest")
    .addEventListener(
      "click",
      function () {

        output.innerHTML = "";
        summary.innerHTML = "";


        /*
         * =====================================================
         * بررسی وابستگی‌ها
         * =====================================================
         */

        if (
          !window.DigiYarProductData
        ) {

          summary.innerHTML =
            '<div class="summary fail">✗ Product Data Layer پیدا نشد.</div>';

          return;

        }


        if (
          !window.DigiYarProductScoring
        ) {

          summary.innerHTML =
            '<div class="summary fail">✗ Product Scoring Engine پیدا نشد.</div>';

          return;

        }


        /*
         * =====================================================
         * TEST 1 — Budget
         * =====================================================
         */

        const budgets = [

          {
            value: 8000000,
            expected: 0
          },

          {
            value: 10000000,
            expected: 1
          },

          {
            value: 15000000,
            expected: 3
          },

          {
            value: 500000000,
            expected: 3
          }

        ];


        let budgetPassed = true;

        const budgetResults = [];


        budgets.forEach(
          function (item) {

            const results =
              DigiYarProductScoring
                .recommend(
                  createNeed(
                    item.value
                  )
                );


            const count =
              results.length;


            const passed =
              count === item.expected;


            if (!passed) {

              budgetPassed = false;

            }


            budgetResults.push({

              budget:
                item.value,

              expected:
                item.expected,

              actual:
                count,

              passed:
                passed,

              products:
                results.map(
                  function (product) {

                    return {

                      name:
                        product.name,

                      price:
                        product.price,

                      score:
                        product.score

                    };

                  }
                )

            });

          }
        );


        addTestResult(

          "۱) تست رفتار بودجه",

          budgetPassed,

          budgetPassed

            ? "تمام ۴ سناریوی بودجه مطابق انتظار عمل کردند."

            : "حداقل یکی از سناریوهای بودجه با مقدار مورد انتظار مطابقت ندارد."

        );


        const budgetBox =
          document.createElement("div");

        budgetBox.className =
          "test";


        budgetBox.innerHTML = `

          <h3>جزئیات تست بودجه</h3>

          <pre>${JSON.stringify(
            budgetResults,
            null,
            2
          )}</pre>

        `;


        output.appendChild(
          budgetBox
        );


        /*
         * =====================================================
         * TEST 2 — Constraint
         * =====================================================
         */

        const constraintNeed = {

          category: "mobile",

          intent: "purchase",

          budget: {

            min: null,

            max: 15000000

          },

          priorities: [],

          requirements: [],

          constraints: [

            {

              id: "constraints",

              value: "وزن کم"

            }

          ],

          context: {

            usage: ""

          }

        };


        const constraintResults =
          DigiYarProductScoring
            .recommend(
              constraintNeed
            );


        const batteryProduct =
          getProduct(
            constraintResults,
            "موبایل باتری‌محور"
          );


        const constraintPassed =
          batteryProduct &&
          Number(
            batteryProduct.score
          ) === 20;


        addTestResult(

          "۲) تست Constraint",

          constraintPassed,

          constraintPassed

            ? 'محصول «موبایل باتری‌محور» به دلیل داشتن ویژگی «وزن کم»، دقیقاً ۱۰ امتیاز جریمه شد.'

            : 'امتیاز محصول «موبایل باتری‌محور» برابر مقدار مورد انتظار نیست.'

        );


        const constraintBox =
          document.createElement("div");

        constraintBox.className =
          "test";


        constraintBox.innerHTML = `

          <h3>جزئیات تست Constraint</h3>

          <pre>${JSON.stringify(
            constraintResults.map(
              function (product) {

                return {

                  name:
                    product.name,

                  price:
                    product.price,

                  score:
                    product.score,

                  features:
                    product.features

                };

              }
            ),
            null,
            2
          )}</pre>

        `;


        output.appendChild(
          constraintBox
        );


        /*
         * =====================================================
         * TEST 3 — Priorities + Requirements
         * =====================================================
         */

        const priorityNeed = {

          category: "mobile",

          intent: "purchase",

          budget: {

            min: null,

            max: 15000000

          },

          priorities: [

            "دوربین",

            "باتری"

          ],

          requirements: [

            {

              id: "requirements",

              value: "5G"

            }

          ],

          constraints: [],

          context: {

            usage: ""

          }

        };


        const priorityResults =
          DigiYarProductScoring
            .recommend(
              priorityNeed
            );


        const expectedScores = {

          "موبایل اقتصادی متعادل":
            53,

          "موبایل دوربین‌محور":
            53,

          "موبایل باتری‌محور":
            38

        };


        let priorityPassed = true;

        const priorityCheck = [];


        Object.keys(
          expectedScores
        ).forEach(
          function (name) {

            const product =
              getProduct(
                priorityResults,
                name
              );


            const expected =
              expectedScores[name];


            const actual =
              product
                ? Number(product.score)
                : null;


            const passed =
              actual === expected;


            if (!passed) {

              priorityPassed = false;

            }


            priorityCheck.push({

              name:
                name,

              expected:
                expected,

              actual:
                actual,

              passed:
                passed

            });

          }
        );


        addTestResult(

          "۳) تست Priorities + Requirements",

          priorityPassed,

          priorityPassed

            ? "امتیاز هر سه محصول دقیقاً مطابق منطق فعلی Product Scoring است."

            : "حداقل یکی از امتیازهای مورد انتظار با خروجی موتور مطابقت ندارد."

        );


        const priorityBox =
          document.createElement("div");

        priorityBox.className =
          "test";


        priorityBox.innerHTML = `

          <h3>جزئیات تست Priorities + Requirements</h3>

          <pre>${JSON.stringify(
            priorityCheck,
            null,
            2
          )}</pre>

        `;


        output.appendChild(
          priorityBox
        );


        /*
         * =====================================================
         * نتیجه نهایی
         * =====================================================
         */

        const allPassed =
          budgetPassed &&
          constraintPassed &&
          priorityPassed;


        summary.innerHTML = `

          <div class="summary ${
            allPassed
              ? "pass"
              : "fail"
          }">

            ${
              allPassed
                ? "✓ ALL PRODUCT SCORING TESTS PASSED"
                : "✗ PRODUCT SCORING TESTS FAILED"
            }

          </div>

        `;

      }
    );

})();

</script>

</body>
</html>
