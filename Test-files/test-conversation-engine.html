<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiYar V4 — Conversation Engine Test</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;background:#f5f5f5;color:#222;margin:0;padding:20px}
    .container{max-width:900px;margin:auto}
    h1{margin-bottom:5px}.subtitle{color:#666;margin-bottom:20px}
    button{background:#e6123d;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:15px;cursor:pointer;margin-bottom:20px}
    .test{background:#fff;border-radius:10px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .pass{color:green;font-weight:bold}.fail{color:#d00;font-weight:bold}
    pre{background:#f1f1f1;padding:12px;border-radius:8px;overflow-x:auto;white-space:pre-wrap;direction:ltr;text-align:left}
    .summary{font-size:20px;font-weight:bold;margin:20px 0}
  </style>
</head>
<body>
<div class="container">
  <h1>تست Conversation Engine — V4</h1>
  <div class="subtitle">Build 3 — Alpha 1</div>
  <button onclick="runTests()">اجرای تست‌ها</button>
  <div id="summary"></div>
  <div id="results"></div>
</div>

<!-- This test lives in /Test-files; engine files live in /js. -->
<script src="../js/need-understanding.js"></script>
<script src="../js/question-engine.js"></script>
<script src="../js/conversation-engine.js"></script>

<script>
function runTests(){
  const results=[];
  const Engine=window.DigiYarConversationEngine;

  if(!Engine){
    document.getElementById('summary').innerHTML='❌ ENGINE NOT LOADED';
    document.getElementById('results').innerHTML='<div class="test"><pre>Expected window.DigiYarConversationEngine but it was not found.</pre></div>';
    return;
  }

  function add(name,fn){
    try{
      const output=fn();
      results.push({name,pass:Boolean(output.pass),output:output.state||output});
    }catch(error){
      results.push({name,pass:false,output:String(error)});
    }
  }

  add('سناریو ۱ — شروع گفتگو با نیاز ناقص',()=>{
    const state=Engine.start('یه گوشی خوب می‌خوام.');
    return {pass:state.need.category==='mobile'&&state.need.budget===null&&state.need.usage.length===0&&state.question.questionId==='budget'&&state.status==='waiting_for_answer',state};
  });

  add('سناریو ۲ — دریافت بودجه و رفتن به سؤال بعدی',()=>{
    let state=Engine.start('یه گوشی خوب می‌خوام.');
    state=Engine.continueConversation(state,'تا ۱۵ میلیون');
    return {pass:state.need.budget!==null&&state.need.budget.max===15000000&&state.question.questionId==='usage'&&state.status==='waiting_for_answer',state};
  });

  add('سناریو ۳ — تکمیل کامل نیاز',()=>{
    let state=Engine.start('یه گوشی خوب می‌خوام.');
    state=Engine.continueConversation(state,'تا ۱۵ میلیون');
    state=Engine.continueConversation(state,'برای عکاسی');
    return {pass:state.need.category==='mobile'&&state.need.budget&&state.need.budget.max===15000000&&state.need.usage.includes('photography')&&state.status==='complete'&&state.question.ready===true,state};
  });

  add('سناریو ۴ — نیاز کامل در اولین پیام',()=>{
    const state=Engine.start('یه گوشی تا ۱۵ میلیون برای عکاسی می‌خوام.');
    return {pass:state.status==='complete'&&state.question.ready===true&&state.question.question===null,state};
  });

  add('سناریو ۵ — ثبت تاریخچه گفتگو',()=>{
    let state=Engine.start('یه گوشی خوب می‌خوام.');
    state=Engine.continueConversation(state,'تا ۱۵ میلیون');
    state=Engine.continueConversation(state,'برای عکاسی');
    return {pass:Array.isArray(state.history)&&state.history.length===3&&state.turn===3,state};
  });

  let passed=0;
  let html='';
  results.forEach(result=>{
    if(result.pass) passed++;
    html+=`<div class="test"><div class="${result.pass?'pass':'fail'}">${result.pass?'✅ PASS':'❌ FAIL'}</div><h3>${result.name}</h3><pre>${JSON.stringify(result.output,null,2)}</pre></div>`;
  });

  document.getElementById('summary').innerHTML=passed===results.length?`🎉 ALL TESTS PASSED — ${passed} از ${results.length}`:`⚠️ SOME TESTS FAILED — ${passed} از ${results.length}`;
  document.getElementById('results').innerHTML=html;
}
</script>
</body>
</html>
