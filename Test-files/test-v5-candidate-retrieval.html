<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DigiYar V5.1 — Candidate Retrieval Test</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;line-height:1.8}
    button{padding:10px 16px;cursor:pointer} pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:8px}
    .ok{color:#087f23}.err{color:#b00020}
  </style>
</head>
<body>
  <h1>Candidate Retrieval V5.1</h1>
  <p>این تست فقط مسیر Need → Catalog → Candidate Retrieval را بررسی می‌کند.</p>
  <button id="run">اجرای تست</button>
  <div id="status"></div>
  <pre id="output"></pre>

  <script src="../js/v5-need-understanding.js"></script>
  <script src="../js/v5-catalog-adapter.js"></script>
  <script src="../js/v5-candidate-retrieval.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    $('run').addEventListener('click', async () => {
      $('status').textContent = 'در حال اجرا...';
      try {
        const text = 'گوشی سامسونگ برای بازی و استفاده روزمره تا ۳۰ میلیون تومان با باتری قوی';
        const need = window.DigiYarV5NeedUnderstanding.analyze(text);
        const result = await window.DigiYarV5CandidateRetrieval.find(need, {
          categories: ['mobile'],
          limit: 10
        });
        const view = {
          need,
          result: {
            version: result.version,
            ready: result.ready,
            count: result.count,
            diagnostics: result.diagnostics,
            candidates: result.candidates.map(item => ({
              id: item.product.id,
              name: item.product.name,
              brand: item.product.brand,
              category: item.product.category,
              subcategory: item.product.subcategory,
              retrievalScore: item.retrievalScore,
              matchedTokens: item.matchedTokens,
              bestOffer: item.product.bestOffer
            }))
          }
        };
        $('status').className = 'ok';
        $('status').textContent = 'تست اجرا شد؛ خروجی زیر است.';
        $('output').textContent = JSON.stringify(view, null, 2);
      } catch (error) {
        $('status').className = 'err';
        $('status').textContent = 'خطا: ' + error.message;
        $('output').textContent = error.stack || String(error);
      }
    });
  </script>
</body>
</html>
