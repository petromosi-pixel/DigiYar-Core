<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DigiYar V3 - Architecture Test</title>

  <style>

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      padding: 20px;
      line-height: 1.8;
    }

    .box {
      max-width: 760px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
    }

    .item {
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      background: #f7f8fa;
    }

    .ok {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      background: #eee;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
    }

  </style>

</head>

<body>

<div class="box">

  <h2>
    تست معماری محصول DigiYar V3
  </h2>

  <div id="result"></div>

</div>


<!-- ترتیب بارگذاری مهم است -->

<script src="js/affiliate.js"></script>

<script src="js/product-data.js"></script>

<script src="js/product-scoring.js"></script>


<script>

(function () {

  const result =
    document.getElementById("result");


  function add(
    title,
    success,
    details
  ) {

    result.innerHTML += `

      <div class="item">

        <strong class="${
          success
            ? "ok"
            : "error"
        }">

          ${
            success
              ? "✓ "
              : "✗ "
          }

          ${title}

        </strong>

        <br>

        ${details}

      </div>

    `;

  }


  /*
   * تست ۱
   * Affiliate Manager
   */

  const affiliateOK =
    window.DigiYarAffiliate &&
    typeof
      window.DigiYarAffiliate.buildLink ===
      "function";


  add(

    "Affiliate Manager",

    affiliateOK,

    affiliateOK
      ? "affiliate.js با موفقیت بارگذاری شده است."
      : "DigiYarAffiliate پیدا نشد."

  );


  /*
   * تست ۲
   * Product Data Layer
   */

  const dataOK =
    window.DigiYarProductData &&
    typeof
      window.DigiYarProductData.getAll ===
      "function";


  add(

    "Product Data Layer",

    dataOK,

    dataOK
      ? "product-data.js با موفقیت بارگذاری شده است."
      : "DigiYarProductData پیدا نشد."

  );


  if (!dataOK) {

    return;

  }


  /*
   * تست ۳
   * دریافت محصولات
   */

  const products =
    DigiYarProductData.getAll();


  add(

    "دریافت محصولات",

    products.length > 0,

    "تعداد محصولات: " +
    products.length

  );


  /*
   * تست ۴
   * Product Scoring
   */

  const scoringOK =
    window.DigiYarProductScoring &&
    typeof
      window.DigiYarProductScoring.recommend ===
      "function";


  add(

    "Product Scoring Engine",

    scoringOK,

    scoringOK
      ? "موتور امتیازدهی آماده است."
      : "DigiYarProductScoring پیدا نشد."

  );


  if (!scoringOK) {

    return;

  }


  /*
   * تست ۵
   * نیاز آزمایشی
   */

  const need = {

    category: "mobile",

    budget: {

      max: 500000000

    },

    priorities: [],

    requirements: [],

    constraints: [],

    context: {

      usage: ""

    }

  };


  /*
   * تست ۶
   * پیشنهادها
   */

  const recommendations =
    DigiYarProductScoring
      .recommend(need);


  add(

    "دریافت پیشنهادها",

    recommendations.length > 0,

    "تعداد پیشنهادها: " +
    recommendations.length

  );


  /*
   * نمایش محصولات
   */

  recommendations.forEach(
    function (product) {

      const affiliateOK =
        String(
          product.url || ""
        ).includes(
          "aflo.ir"
        );


      add(

        product.name,

        affiliateOK,

        `

          فروشگاه:
          ${product.store}

          <br>

          قیمت:
          ${new Intl.NumberFormat(
            "fa-IR"
          ).format(
            product.price
          )}
          تومان

          <br>

          امتیاز:
          ${product.score}%

          <pre>
${product.url}
          </pre>

        `

      );

    }
  );


})();

</script>

</body>

</html>
