<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>DigiYar V5.1 — Housh Yar Need Understanding Test</title>
<style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:0 16px}button{margin:6px;padding:8px 14px}pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}</style>
</head>
<body>
<h1>تست هسته فهم نیاز هوش‌یار V5.1</h1>
<div id="out"></div>
<script src="../js/v5-need-understanding.js"></script>
<script>
(function(){
  const tests = [
    "گوشی سامسونگ برای عکاسی تا ۱۵ میلیون",
    "لپ تاپ گیمینگ لنوو بین ۶۰ تا ۸۰ میلیون",
    "تلویزیون برای استفاده روزمره با قیمت مناسب",
    "من یک گوشی می‌خوام"
  ];
  const out=document.getElementById('out');
  tests.forEach(function(input){
    const result=window.DigiYarV5NeedUnderstanding.analyze(input);
    const block=document.createElement('section');
    block.innerHTML='<h3>'+input+'</h3><pre>'+JSON.stringify(result,null,2)+'</pre>';
    out.appendChild(block);
  });
})();
</script>
</body>
</html>
