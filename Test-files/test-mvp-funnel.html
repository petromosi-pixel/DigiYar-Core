<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigiYar — MVP Funnel Test</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#111}button{padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;margin:4px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;margin:8px 0 14px;box-sizing:border-box}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 12px #0001}.muted{color:#666;font-size:13px}.cta{display:inline-block;margin-top:12px;padding:11px 15px;background:#087f5b;color:#fff;border-radius:10px;text-decoration:none;margin-left:6px}.ok{color:#087f5b}.warn{color:#9a6700}</style></head><body><h1>🔥 DigiYar MVP Funnel</h1><p>Need → Online Price Constraint → Multi-factor Recommendation → Real Product → Affiliate → Click Tracking</p><label>نیاز کاربر</label><input id="need" value="یه گوشی برای عکاسی تا ۳۰ میلیون می‌خوام"><button id="run">پیشنهاد بده</button><button id="run30">تست بازار تا ۳۰ میلیون</button><div id="out"></div><script src="../js/price-policy.js"></script><script>
const CATALOG_URL="../data/products-online-mvp.json";const TRACK_KEY="digiyar_mvp_affiliate_clicks_v1";const $=id=>document.getElementById(id);function normalize(s){return String(s||'').toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک')}function parseNeed(text){const n=normalize(text);const budget=DigiYarPricePolicy.parseBudget(n);const priorities=[];if(n.includes('عکاسی')||n.includes('دوربین'))priorities.push('camera');if(n.includes('بازی')||n.includes('گیم'))priorities.push('gaming');if(n.includes('باتری'))priorities.push('battery');return{category:'smartphone',budget:budget?.max||0,priorities}}function priorityFit(p,need){const s=p.scores||{};if(need.priorities.includes('camera')&&Number(s.camera||0)<6.5)return false;if(need.priorities.includes('gaming')&&Number(s.performance||0)<7)return false;if(need.priorities.includes('battery')&&Number(s.battery||0)<7)return false;return true}function score(p,need){let s=0;if(need.priorities.includes('camera'))s+=Number(p.scores?.camera||0)*6;if(need.priorities.includes('gaming'))s+=Number(p.scores?.performance||0)*6;if(need.priorities.includes('battery'))s+=Number(p.scores?.battery||0)*6;s+=Number(p.scores?.value||0)*3;s+=Number(p.scores?.battery||0)*1.5;s+=Number(p.scores?.reliability||0)*1.5;return Math.round(s)}function displayPrice(toman){return Number(toman||0).toLocaleString('fa-IR')+' تومان'}function recordClick(p){const now=new Date().toISOString();let events=[];try{events=JSON.parse(localStorage.getItem(TRACK_KEY)||'[]')}catch{}events.push({event:'affiliate_click',timestamp:now,product_id:p.id,brand:p.brand,model:p.model,variant:p.variant,affiliate_url:p.affiliate?.url||null,affiliate_network:p.affiliate?.network||null,destination_product_id:p.destination?.product_id||null,destination_url:p.destination?.url||null});localStorage.setItem(TRACK_KEY,JSON.stringify(events.slice(-500)));return events.length}function exportTracking(){const events=JSON.parse(localStorage.getItem(TRACK_KEY)||'[]');const blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='digiyar-affiliate-clicks.json';a.click();URL.revokeObjectURL(a.href)}function run(){const out=$('out');out.innerHTML='<div class="card">در حال ساخت پیشنهاد...</div>';const need=parseNeed($('need').value);fetch(CATALOG_URL).then(r=>r.json()).then(data=>{const products=(data.products||[]).filter(p=>p.category==='smartphone').filter(p=>need.budget===0||(Number.isFinite(Number(p.price_toman))&&Number(p.price_toman)>0&&Number(p.price_toman)<=need.budget)).filter(p=>priorityFit(p,need)).map(p=>({...p,score:score(p,need)})).sort((a,b)=>b.score-a.score).slice(0,3);const cards=products.length?products.map((p,i)=>{const aff=p.affiliate?.url||'';const link=aff?'<a class="cta affiliate-link" href="'+aff+'" data-product="'+encodeURIComponent(p.id)+'" target="_blank" rel="noopener">مشاهده از مسیر Affiliate</a>':'';return '<div class="card"><b>#'+(i+1)+' '+p.brand+' '+p.model+' '+p.variant+'</b><p>'+((p.best_for||[]).join('، '))+'</p><div>قیمت آنلاین مرجع: <b>'+displayPrice(p.price_toman)+'</b></div><div>امتیاز تطبیق چندعاملی: <b>'+p.score+'</b></div><div class="muted">منبع قیمت: '+p.price_source+' | بررسی: '+p.price_checked_at+'</div><div class="muted">دوربین: '+p.scores.camera+' | باتری: '+p.scores.battery+' | ارزش خرید: '+p.scores.value+'</div>'+(p.destination?.product_id?'<div class="muted">مقصد Affiliate: Digikala '+p.destination.product_id+'</div>':'')+(p.product_url?'<a class="cta" href="'+p.product_url+'" target="_blank" rel="noopener">مشاهده منبع/خرید</a>':'')+(link||'<p class="muted">Affiliate: هنوز URL اختصاصی محصول ثبت نشده؛ لینک خرید مستقیم نمایش داده می‌شود.</p>')+'</div>'}).join(''):'<div class="card warn"><b>هیچ محصول واجد شرایطی پیدا نشد.</b><p>قیمت باید از کاتالوگ آنلاین معتبر و به تومان باشد، از سقف بودجه عبور نکند و حداقل کیفیت لازم برای اولویت کاربر را داشته باشد.</p></div>';out.innerHTML='<div class="card"><b>Need</b><br>'+JSON.stringify(need)+'</div>'+cards+'<div class="card"><b>کنترل Funnel</b><p class="ok">✓ فقط محصولات واقعی Catalog با قیمت تومانی معتبر و داخل Budget وارد Recommendation شده‌اند.</p><p class="ok">✓ کلیک Affiliate در همین مرورگر با product_id و زمان ثبت می‌شود.</p><button id="export">خروجی Click Tracking</button></div>';document.querySelectorAll('.affiliate-link').forEach(a=>a.addEventListener('click',()=>{const p=products.find(x=>x.id===decodeURIComponent(a.dataset.product));if(p)recordClick(p)}));$('export').onclick=exportTracking}).catch(()=>out.innerHTML='<div class="card warn">Online Catalog بارگذاری نشد.</div>')}$('run').onclick=run;$('run30').onclick=()=>{$('need').value='یه گوشی برای عکاسی تا ۳۰ میلیون می‌خوام';run()};run();</script></body></html>
