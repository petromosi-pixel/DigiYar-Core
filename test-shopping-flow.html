<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DigiYar V4 — Shopping Flow Test
  </title>

  <style>

    body {
      font-family: Tahoma, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #172033;
    }

    .summary {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
      background: white;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c62828;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f0f2f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

  </style>

</head>


<body>

  <h1>
    تست Shopping Flow — V4
  </h1>

  <p>
    <strong>
      Build 8 — Alpha 1
    </strong>
  </p>

  <div
    id="summary"
    class="summary"
  >
    در حال اجرای تست‌ها...
  </div>

  <div id="results"></div>


  <!-- =====================================================
       Dependencies
       ===================================================== -->

  <script src="./js/conversation-engine.js"></script>

  <script src="./js/answer-interpreter.js"></script>

  <script src="./js/need-integration.js"></script>

  <script src="./js/conversation-state.js"></script>

  <script src="./js/product-retrieval.js"></script>

  <script src="./js/product-retrieval-integration.js"></script>

  <script src="./js/shopping-flow.js"></script>


  <script>

    "use strict";


    const results = [];


    /* =====================================================
       Helpers
       ===================================================== */

    function addResult(
      name,
      passed,
      data
    ) {

      results.push({

        name:
          name,

        passed:
          passed,

        data:
          data

      });

    }


    function errorData(error) {

      return {

        error:
          error &&
          error.message
            ? error.message
            : String(error)

      };

    }


    function renderResults() {

      const container =
        document.getElementById(
          "results"
        );


      container.innerHTML = "";


      results.forEach(
        function (
          test,
          index
        ) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "test";


          div.innerHTML = `

            <h3 class="${
              test.passed
                ? "pass"
                : "fail"
            }">

              ${
                test.passed
                  ? "✅ PASS"
                  : "❌ FAIL"
              }

              — سناریو ${index + 1}

            </h3>

            <strong>
              ${test.name}
            </strong>

            <pre>${JSON.stringify(
              test.data,
              null,
              2
            )}</pre>

          `;


          container.appendChild(
            div
          );

        }
      );


      const passed =
        results.filter(
          function (item) {

            return item.passed;

          }
        ).length;


      const total =
        results.length;


      const summary =
        document.getElementById(
          "summary"
        );


      if (
        passed === total &&
        total > 0
      ) {

        summary.className =
          "summary pass";


        summary.innerHTML =
          `🎉 ALL TESTS PASSED — ${passed} از ${total}`;

      }

      else {

        summary.className =
          "summary fail";


        summary.innerHTML =
          `⚠️ SOME TESTS FAILED — ${passed} از ${total}`;

      }

    }


    /* =====================================================
       BUILD 8 DEPENDENCY CHECK
       ===================================================== */

    try {

      const dependencies = {

        conversationEngine:
          typeof DigiyarConversationEngine !==
          "undefined",

        answerInterpreter:
          typeof DigiyarAnswerInterpreter !==
          "undefined",

        needIntegration:
          typeof DigiyarNeedIntegration !==
          "undefined",

        conversationState:
          typeof DigiyarConversationState !==
          "undefined",

        productRetrieval:
          typeof DigiYarProductRetrieval !==
          "undefined",

        productRetrievalIntegration:
          typeof DigiyarProductRetrievalIntegration !==
          "undefined",

        shoppingFlow:
          typeof DigiyarShoppingFlow !==
          "undefined"

      };


      const passed =
        Object.values(
          dependencies
        ).every(
          Boolean
        );


      addResult(

        "بررسی کامل Dependencyهای Build 3 تا 8",

        passed,

        dependencies

      );

    }

    catch (error) {

      addResult(

        "بررسی Dependencyهای Build 8",

        false,

        errorData(error)

      );

    }


    /* =====================================================
       SCENARIO 2
       START SHOPPING FLOW
       ===================================================== */

    try {

      const state =
        DigiyarShoppingFlow.create();


      const result =
        await DigiyarShoppingFlow.process(

          state,

          "یه گوشی خوب می‌خوام."

        );


      const passed =

        result

        &&

        result.status ===
          "waiting_for_answer"

        &&

        result.state

        &&

        result.state.turn ===
          1

        &&

        result.need

        &&

        result.need.category ===
          "mobile"

        &&

        result.need.ready ===
          false

        &&

        result.question !==
          null;


      addResult(

        "شروع Shopping Flow با Need ناقص",

        passed,

        result

      );

    }

    catch (error) {

      addResult(

        "شروع Shopping Flow با Need ناقص",

        false,

        errorData(error)

      );

    }


    /* =====================================================
       SCENARIO 3
       MULTI TURN FLOW
       ===================================================== */

    try {

      let state =
        DigiyarShoppingFlow.create();


      const r1 =
        await DigiyarShoppingFlow.process(

          state,

          "یه گوشی خوب می‌خوام."

        );


      state =
        r1.state;


      const r2 =
        await DigiyarShoppingFlow.process(

          state,

          "تا ۱۵ میلیون"

        );


      state =
        r2.state;


      const r3 =
        await DigiyarShoppingFlow.process(

          state,

          "برای عکاسی"

        );


      const passed =

        r3.need

        &&

        r3.need.category ===
          "mobile"

        &&

        r3.need.budget

        &&

        r3.need.budget.max ===
          15000000

        &&

        Array.isArray(
          r3.need.usage
        )

        &&

        r3.need.usage.includes(
          "photography"
        )

        &&

        r3.need.ready ===
          true

        &&

        r3.status ===
          "complete";


      addResult(

        "تکمیل Shopping Flow در چند Turn",

        passed,

        {

          status:
            r3.status,

          turn:
            r3.turn,

          need:
            r3.need,

          question:
            r3.question

        }

      );

    }

    catch (error) {

      addResult(

        "تکمیل Shopping Flow در چند Turn",

        false,

        errorData(error)

      );

    }


    /* =====================================================
       SCENARIO 4
       COMPLETE REQUEST
       ===================================================== */

    try {

      const state =
        DigiyarShoppingFlow.create();


      const result =
        await DigiyarShoppingFlow.process(

          state,

          "یه گوشی تا ۱۵ میلیون برای عکاسی می‌خوام."

        );


      const passed =

        result.need

        &&

        result.need.category ===
          "mobile"

        &&

        result.need.budget

        &&

        result.need.budget.max ===
          15000000

        &&

        result.need.usage.includes(
          "photography"
        )

        &&

        result.need.ready ===
          true

        &&

        result.status ===
          "complete";


      addResult(

        "پردازش Need کامل در یک Turn",

        passed,

        result

      );

    }

    catch (error) {

      addResult(

        "پردازش Need کامل در یک Turn",

        false,

        errorData(error)

      );

    }


    /* =====================================================
       SCENARIO 5
       RETRIEVAL HANDOFF
       ===================================================== */

    try {

      const state =
        DigiyarShoppingFlow.create();


      const result =
        await DigiyarShoppingFlow.process(

          state,

          "یه گوشی تا ۱۵ میلیون برای عکاسی می‌خوام."

        );


      const passed =

        result.need.ready ===
          true

        &&

        result.need.nextAction ===
          "retrieve_products"

        &&

        (
          result.retrieval ===
            null

          ||

          typeof result.retrieval ===
            "object"

        );


      addResult(

        "تحویل صحیح Need آماده به مرحله Retrieval",

        passed,

        {

          status:
            result.status,

          nextAction:
            result.need.nextAction,

          retrieval:
            result.retrieval || null

        }

      );

    }

    catch (error) {

      addResult(

        "تحویل صحیح Need آماده به Retrieval",

        false,

        errorData(error)

      );

    }


    /* =====================================================
       SCENARIO 6
       STATE PRESERVATION
       ===================================================== */

    try {

      let state =
        DigiyarShoppingFlow.create();


      const r1 =
        await DigiyarShoppingFlow.process(

          state,

          "یه گوشی خوب می‌خوام."

        );


      state =
        r1.state;


      const r2 =
        await DigiyarShoppingFlow.process(

          state,

          "هنوز نمی‌دونم"

        );


      const passed =

        r2.need.category ===
          "mobile"

        &&

        r2.need.budget ===
          null

        &&

        r2.need.ready ===
          false

        &&

        r2.status ===
          "waiting_for_answer"

        &&

        r2.state.turn ===
          2;


      addResult(

        "حفظ State در پاسخ نامفهوم",

        passed,

        r2

      );

    }

    catch (error) {

      addResult(

        "حفظ State در پاسخ نامفهوم",

        false,

        errorData(error)

      );

    }


    /* =====================================================
       SCENARIO 7
       HISTORY
       ===================================================== */

    try {

      let state =
        DigiyarShoppingFlow.create();


      const r1 =
        await DigiyarShoppingFlow.process(

          state,

          "یه گوشی خوب می‌خوام."

        );


      state =
        r1.state;


      const r2 =
        await DigiyarShoppingFlow.process(

          state,

          "تا ۱۵ میلیون"

        );


      state =
        r2.state;


      const r3 =
        await DigiyarShoppingFlow.process(

          state,

          "برای عکاسی"

        );


      const history =
        r3.state.history;


      const passed =

        Array.isArray(
          history
        )

        &&

        history.length ===
          3

        &&

        history[0].turn ===
          1

        &&

        history[1].turn ===
          2

        &&

        history[2].turn ===
          3;


      addResult(

        "ثبت صحیح History در Shopping Flow",

        passed,

        {

          turn:
            r3.state.turn,

          history:
            history

        }

      );

    }

    catch (error) {

      addResult(

        "ثبت صحیح History در Shopping Flow",

        false,

        errorData(error)

      );

    }


    /* =====================================================
       FINAL RENDER
       ===================================================== */

    renderResults();

  </script>

</body>

</html>
