<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DigiYar V4 — Shopping Flow Test
  </title>

  <style>

    body {
      font-family: Tahoma, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #172033;
    }

    .summary {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      background: white;
      font-weight: bold;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c62828;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f0f2f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

  </style>

</head>


<body>

  <h1>
    تست Shopping Flow — V4
  </h1>

  <p>
    <strong>
      Build 8 — Alpha 1
    </strong>
  </p>

  <div
    id="summary"
    class="summary"
  >
    در حال اجرای تست‌ها...
  </div>

  <div id="results"></div>


  <!-- =====================================================
       Dependencies
       ===================================================== -->

  <script src="./js/conversation-engine.js"></script>

  <script src="./js/answer-interpreter.js"></script>

  <script src="./js/need-integration.js"></script>

  <script src="./js/conversation-state.js"></script>

  <script src="./js/product-retrieval.js"></script>

  <script src="./js/product-retrieval-integration.js"></script>

  <script src="./js/shopping-flow.js"></script>


  <script>

    "use strict";


    const results = [];


    /* =====================================================
       Helper
       ===================================================== */

    function addResult(
      name,
      passed,
      data
    ) {

      results.push({

        name:
          name,

        passed:
          passed,

        data:
          data

      });

    }


    function getError(error) {

      return {

        error:
          error &&
          error.message
            ? error.message
            : String(error)

      };

    }


    /* =====================================================
       Render
       ===================================================== */

    function renderResults() {

      const container =
        document.getElementById(
          "results"
        );


      container.innerHTML = "";


      results.forEach(
        function (
          test,
          index
        ) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "test";


          div.innerHTML = `

            <h3 class="${
              test.passed
                ? "pass"
                : "fail"
            }">

              ${
                test.passed
                  ? "✅ PASS"
                  : "❌ FAIL"
              }

              — سناریو ${index + 1}

            </h3>

            <strong>
              ${test.name}
            </strong>

            <pre>${JSON.stringify(
              test.data,
              null,
              2
            )}</pre>

          `;


          container.appendChild(
            div
          );

        }
      );


      const passed =
        results.filter(
          function (item) {

            return item.passed;

          }
        ).length;


      const total =
        results.length;


      const summary =
        document.getElementById(
          "summary"
        );


      if (
        total > 0 &&
        passed === total
      ) {

        summary.className =
          "summary pass";


        summary.innerHTML =
          `🎉 ALL TESTS PASSED — ${passed} از ${total}`;

      }

      else {

        summary.className =
          "summary fail";


        summary.innerHTML =
          `⚠️ SOME TESTS FAILED — ${passed} از ${total}`;

      }

    }


    /* =====================================================
       RUN ALL TESTS
       ===================================================== */

    async function runTests() {


      /* ===================================================
         Scenario 1
         Dependency Check
         =================================================== */

      try {

        const dependencies = {

          conversationEngine:
            typeof DigiyarConversationEngine !==
            "undefined",

          answerInterpreter:
            typeof DigiyarAnswerInterpreter !==
            "undefined",

          needIntegration:
            typeof DigiyarNeedIntegration !==
            "undefined",

          conversationState:
            typeof DigiyarConversationState !==
            "undefined",

          productRetrieval:
            typeof DigiYarProductRetrieval !==
            "undefined",

          productRetrievalIntegration:
            typeof DigiyarProductRetrievalIntegration !==
            "undefined",

          shoppingFlow:
            typeof DigiyarShoppingFlow !==
            "undefined"

        };


        const passed =
          Object.values(
            dependencies
          ).every(
            Boolean
          );


        addResult(

          "بررسی کامل Dependencyهای Build 3 تا 8",

          passed,

          dependencies

        );

      }

      catch (error) {

        addResult(

          "بررسی Dependencyهای Build 8",

          false,

          getError(error)

        );

      }


      /* ===================================================
         Scenario 2
         Create Session
         =================================================== */

      try {

        const state =
          DigiyarShoppingFlow
            .createSession();


        const passed =

          state !== null

          &&

          state.turn ===
            0

          &&

          state.status ===
            "active"

          &&

          Array.isArray(
            state.history
          );


        addResult(

          "ساخت Session اولیه Shopping Flow",

          passed,

          state

        );

      }

      catch (error) {

        addResult(

          "ساخت Session اولیه Shopping Flow",

          false,

          getError(error)

        );

      }


      /* ===================================================
         Scenario 3
         First Turn
         =================================================== */

      try {

        const state =
          DigiyarShoppingFlow
            .createSession();


        const result =
          await DigiyarShoppingFlow.process(

            state,

            "یه گوشی خوب می‌خوام."

          );


        const passed =

          result.status ===
            "waiting_for_answer"

          &&

          result.state.turn ===
            1

          &&

          result.need.category ===
            "mobile"

          &&

          result.need.ready ===
            false

          &&

          result.question !==
            null

          &&

          Array.isArray(
            result.products
          )

          &&

          result.products.length ===
            0;


        addResult(

          "شروع Shopping Flow با Need ناقص",

          passed,

          result

        );

      }

      catch (error) {

        addResult(

          "شروع Shopping Flow با Need ناقص",

          false,

          getError(error)

        );

      }


      /* ===================================================
         Scenario 4
         Multi Turn Completion
         =================================================== */

      try {

        let state =
          DigiyarShoppingFlow
            .createSession();


        const r1 =
          await DigiyarShoppingFlow.process(

            state,

            "یه گوشی خوب می‌خوام."

          );


        state =
          r1.state;


        const r2 =
          await DigiyarShoppingFlow.process(

            state,

            "تا ۱۵ میلیون"

          );


        state =
          r2.state;


        const r3 =
          await DigiyarShoppingFlow.process(

            state,

            "برای عکاسی"

          );


        const passed =

          r3.need.category ===
            "mobile"

          &&

          r3.need.budget

          &&

          r3.need.budget.max ===
            15000000

          &&

          Array.isArray(
            r3.need.usage
          )

          &&

          r3.need.usage.includes(
            "photography"
          )

          &&

          r3.need.ready ===
            true

          &&

          r3.need.nextAction ===
            "retrieve_products"

          &&

          r3.state.turn ===
            3

          &&

          Array.isArray(
            r3.products
          );


        addResult(

          "تکمیل Shopping Flow در چند Turn",

          passed,

          {

            status:
              r3.status,

            turn:
              r3.state.turn,

            need:
              r3.need,

            productsCount:
              r3.products.length,

            error:
              r3.error

          }

        );

      }

      catch (error) {

        addResult(

          "تکمیل Shopping Flow در چند Turn",

          false,

          getError(error)

        );

      }


      /* ===================================================
         Scenario 5
         Complete Request In One Turn
         =================================================== */

      try {

        const state =
          DigiyarShoppingFlow
            .createSession();


        const result =
          await DigiyarShoppingFlow.process(

            state,

            "یه گوشی تا ۱۵ میلیون برای عکاسی می‌خوام.",

            {
              retrieval: {
                remote: false
              }
            }

          );


        const passed =

          result.need.category ===
            "mobile"

          &&

          result.need.budget

          &&

          result.need.budget.max ===
            15000000

          &&

          result.need.usage.includes(
            "photography"
          )

          &&

          result.need.ready ===
            true

          &&

          result.status ===
            "products_retrieved"

          &&

          Array.isArray(
            result.products
          )

          &&

          result.error ===
            null;


        addResult(

          "پردازش درخواست کامل و اجرای Retrieval",

          passed,

          {

            status:
              result.status,

            query:
              result.query,

            count:
              result.count,

            products:
              result.products,

            error:
              result.error

          }

        );

      }

      catch (error) {

        addResult(

          "پردازش درخواست کامل و اجرای Retrieval",

          false,

          getError(error)

        );

      }


      /* ===================================================
         Scenario 6
         Unclear Answer
         =================================================== */

      try {

        let state =
          DigiyarShoppingFlow
            .createSession();


        const r1 =
          await DigiyarShoppingFlow.process(

            state,

            "یه گوشی خوب می‌خوام."

          );


        state =
          r1.state;


        const r2 =
          await DigiyarShoppingFlow.process(

            state,

            "هنوز نمی‌دونم"

          );


        const passed =

          r2.state.turn ===
            2

          &&

          r2.need.category ===
            "mobile"

          &&

          r2.need.budget ===
            null

          &&

          r2.need.ready ===
            false

          &&

          r2.status ===
            "waiting_for_answer"

          &&

          r2.products.length ===
            0;


        addResult(

          "حفظ State در پاسخ نامفهوم",

          passed,

          r2

        );

      }

      catch (error) {

        addResult(

          "حفظ State در پاسخ نامفهوم",

          false,

          getError(error)

        );

      }


      /* ===================================================
         Scenario 7
         History
         =================================================== */

      try {

        let state =
          DigiyarShoppingFlow
            .createSession();


        const r1 =
          await DigiyarShoppingFlow.process(

            state,

            "یه گوشی خوب می‌خوام."

          );


        state =
          r1.state;


        const r2 =
          await DigiyarShoppingFlow.process(

            state,

            "تا ۱۵ میلیون"

          );


        state =
          r2.state;


        const r3 =
          await DigiyarShoppingFlow.process(

            state,

            "برای عکاسی"

          );


        const history =
          r3.state.history;


        const passed =

          Array.isArray(
            history
          )

          &&

          history.length ===
            3

          &&

          history[0].turn ===
            1

          &&

          history[1].turn ===
            2

          &&

          history[2].turn ===
            3

          &&

          r3.state.turn ===
            3;


        addResult(

          "ثبت صحیح History و Turnها در Shopping Flow",

          passed,

          {

            turn:
              r3.state.turn,

            history:
              history

          }

        );

      }

      catch (error) {

        addResult(

          "ثبت صحیح History و Turnها در Shopping Flow",

          false,

          getError(error)

        );

      }


      /* ===================================================
         Final
         =================================================== */

      renderResults();

    }


    /* =====================================================
       START
       ===================================================== */

    runTests().catch(

      function (error) {

        addResult(

          "خطای عمومی اجرای تست",

          false,

          getError(error)

        );


        renderResults();

      }

    );

  </script>

</body>

</html>
