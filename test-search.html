<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست</title>
</head>
<body>
    <h1>تست مستقیم API</h1>
    <button onclick="test()">تست</button>
    <div id="result"></div>
    
    <script>
        async function test() {
            document.getElementById('result').innerHTML = 'در حال تست...';
            
            try {
                const response = await fetch('https://api.digikala.com/v1/search/?q=گوشی&page=1');
                const data = await response.json();
                
                document.getElementById('result').innerHTML = 
                    'تعداد محصولات: ' + data.data.products.length;
                
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    'خطا: ' + error.message;
            }
        }
    </script>
</body>
</html>
