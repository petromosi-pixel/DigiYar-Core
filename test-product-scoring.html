<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تست موتور امتیازدهی دیجی‌یار</title>

    <style>

        body {
            font-family: Tahoma, sans-serif;
            padding: 20px;
            line-height: 2;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            background: #f3f3f3;
            padding: 15px;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
        }

    </style>

</head>


<body>

    <h2>
        تست موتور امتیازدهی محصول دیجی‌یار
    </h2>


    <button onclick="testSingleProduct()">
        ۱. تست یک محصول
    </button>


    <button onclick="testThreeProducts()">
        ۲. مقایسه سه محصول
    </button>


    <button onclick="testBudgetFilter()">
        ۳. تست فیلتر بودجه
    </button>


    <button onclick="testRequirements()">
        ۴. تست Requirements
    </button>


    <button onclick="testConstraints()">
        ۵. تست Constraints
    </button>


    <button onclick="testFullEngine()">
        ۶. تست کامل موتور
    </button>


    <pre id="result"></pre>


    <script src="js/product-scoring.js?v=1.0"></script>


    <script>

        const result =
            document.getElementById("result");


        function show(data) {

            result.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        }


        // ======================================
        // Need پایه
        // ======================================

        function createBaseNeed() {

            return {

                category: "mobile",

                intent: "purchase",

                budget: {

                    min: null,

                    max: 15000000

                },

                priorities: [

                    "camera",

                    "battery",

                    "value"

                ],

                requirements: [],

                constraints: [],

                context: {

                    usage: "عکاسی"

                },

                confidence: 100

            };

        }


        // ======================================
        // محصول A
        // ======================================

        function createProductA() {

            return {

                id: "phone-a",

                category: "mobile",

                name: "گوشی A",

                brand: "Brand A",

                model: "Model A",

                price: {

                    current: 14000000,

                    original: 16000000,

                    currency: "IRR"

                },

                features: {

                    "5G": true,

                    weight: 180

                },

                scores: {

                    camera: 95,

                    battery: 88,

                    performance: 78,

                    display: 82,

                    value: 94

                },

                usageScores: {

                    "عکاسی": 96,

                    "بازی": 70,

                    "کار و استفاده روزمره": 88,

                    "تماشای محتوا": 85

                }

            };

        }


        // ======================================
        // محصول B
        // ======================================

        function createProductB() {

            return {

                id: "phone-b",

                category: "mobile",

                name: "گوشی B",

                brand: "Brand B",

                model: "Model B",

                price: {

                    current: 12000000,

                    original: 13000000,

                    currency: "IRR"

                },

                features: {

                    "5G": true,

                    weight: 195

                },

                scores: {

                    camera: 78,

                    battery: 96,

                    performance: 88,

                    display: 86,

                    value: 90

                },

                usageScores: {

                    "عکاسی": 80,

                    "بازی": 89,

                    "کار و استفاده روزمره": 91,

                    "تماشای محتوا": 90

                }

            };

        }


        // ======================================
        // محصول C
        // ======================================

        function createProductC() {

            return {

                id: "phone-c",

                category: "mobile",

                name: "گوشی C",

                brand: "Brand C",

                model: "Model C",

                price: {

                    current: 9000000,

                    original: 10000000,

                    currency: "IRR"

                },

                features: {

                    "5G": false,

                    weight: 210

                },

                scores: {

                    camera: 62,

                    battery: 72,

                    performance: 60,

                    display: 70,

                    value: 97

                },

                usageScores: {

                    "عکاسی": 64,

                    "بازی": 55,

                    "کار و استفاده روزمره": 78,

                    "تماشای محتوا": 72

                }

            };

        }


        // ======================================
        // تست ۱
        // ======================================

        function testSingleProduct() {

            const need =
                createBaseNeed();


            const product =
                createProductA();


            show(

                DigiyarProductScoring
                    .scoreProduct(
                        need,
                        product
                    )

            );

        }


        // ======================================
        // تست ۲
        // ======================================

        function testThreeProducts() {

            const need =
                createBaseNeed();


            const products = [

                createProductA(),

                createProductB(),

                createProductC()

            ];


            show(

                DigiyarProductScoring
                    .rankProducts(
                        need,
                        products
                    )

            );

        }


        // ======================================
        // تست ۳
        // ======================================

        function testBudgetFilter() {

            const need =
                createBaseNeed();


            const product =
                createProductA();


            product.price.current =
                16000000;


            show({

                need: need,

                product: product,

                result:
                    DigiyarProductScoring
                        .scoreProduct(
                            need,
                            product
                        )

            });

        }


        // ======================================
        // تست ۴
        // ======================================

        function testRequirements() {

            const need =
                createBaseNeed();


            need.requirements = [

                {

                    id: "5G",

                    value: true

                }

            ];


            const product =
                createProductC();


            show({

                need: need,

                product: product,

                result:
                    DigiyarProductScoring
                        .scoreProduct(
                            need,
                            product
                        )

            });

        }


        // ======================================
        // تست ۵
        // ======================================

        function testConstraints() {

            const need =
                createBaseNeed();


            need.constraints = [

                {

                    id: "weight",

                    value: 210

                }

            ];


            const product =
                createProductC();


            show({

                need: need,

                product: product,

                result:
                    DigiyarProductScoring
                        .scoreProduct(
                            need,
                            product
                        )

            });

        }


        // ======================================
        // تست ۶
        // ======================================

        function testFullEngine() {

            const need =
                createBaseNeed();


            need.requirements = [

                {

                    id: "5G",

                    value: true

                }

            ];


            const products = [

                createProductA(),

                createProductB(),

                createProductC()

            ];


            const ranked =
                DigiyarProductScoring
                    .rankProducts(
                        need,
                        products
                    );


            show({

                need: need,

                totalProducts:
                    products.length,

                rankedProducts:
                    ranked

            });

        }

    </script>

</body>

</html>
