<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تست Product Scoring - دیجی‌یار</title>

  <style>

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      padding: 20px;
      line-height: 1.8;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #ff8a00;
      color: #fff;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 10px;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f1f2f4;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .test {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #f7f8fa;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .warning {
      color: #b36b00;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>تست Product Scoring دیجی‌یار</h1>

  <button id="runTest">
    اجرای تست
  </button>

  <div id="output"></div>

</div>


<!-- =====================================================
     DigiYar Engines
     ===================================================== -->

<script src="js/affiliate.js"></script>
<script src="js/product-data.js"></script>
<script src="js/product-scoring.js"></script>


<script>

(function () {

  "use strict";


  const output =
    document.getElementById("output");


  document
    .getElementById("runTest")
    .addEventListener(
      "click",
      function () {

        output.innerHTML = "";


        /*
         * =================================================
         * بررسی Product Data
         * =================================================
         */

        if (
          !window.DigiYarProductData
        ) {

          output.innerHTML =
            "<p class='error'>✗ Product Data Layer پیدا نشد.</p>";

          return;

        }


        /*
         * =================================================
         * بررسی Product Scoring
         * =================================================
         */

        if (
          !window.DigiYarProductScoring
        ) {

          output.innerHTML =
            "<p class='error'>✗ Product Scoring Engine پیدا نشد.</p>";

          return;

        }


        /*
         * =================================================
         * تست ۱ تا ۴:
         * بررسی رفتار موتور در بودجه‌های مختلف
         * =================================================
         */

        const budgets = [

          8000000,

          10000000,

          15000000,

          500000000

        ];


        const budgetTitle =
          document.createElement(
            "h2"
          );


        budgetTitle.textContent =
          "۱) تست رفتار بودجه";


        output.appendChild(
          budgetTitle
        );


        budgets.forEach(
          function (budget) {


            const need = {

              category:
                "mobile",

              intent:
                "purchase",

              budget: {

                min: null,

                max:
                  budget

              },

              priorities: [],

              requirements: [],

              constraints: [],

              context: {

                usage: ""

              }

            };


            const results =
              window.DigiYarProductScoring
                .recommend(
                  need
                );


            const insideBudget =
              results.filter(
                function (product) {

                  return (
                    Number(
                      product.price
                    ) <=
                    budget
                  );

                }
              );


            const test =
              document.createElement(
                "div"
              );


            test.className =
              "test";


            test.innerHTML = `

              <h3>
                بودجه:
                ${new Intl.NumberFormat("fa-IR")
                  .format(budget)}
                تومان
              </h3>

              <p>
                تعداد پیشنهادها:
                ${results.length}
              </p>

              <p>
                تعداد داخل بودجه:
                ${insideBudget.length}
              </p>

              <pre>${JSON.stringify(
                results.map(
                  function (product) {

                    return {

                      name:
                        product.name,

                      price:
                        product.price,

                      score:
                        product.score,

                      store:
                        product.store,

                      url:
                        product.url

                    };

                  }
                ),
                null,
                2
              )}</pre>

            `;


            output.appendChild(
              test
            );

          }
        );


        /*
         * =================================================
         * تست Constraint
         * =================================================
         */

        const constraintTitle =
          document.createElement(
            "h2"
          );


        constraintTitle.textContent =
          "۲) تست Constraint";


        output.appendChild(
          constraintTitle
        );


        /*
         * سناریو:
         *
         * دسته: موبایل
         * بودجه: ۱۵ میلیون
         * Constraint: وزن کم
         *
         * طبق منطق فعلی موتور:
         *
         * mobile-003 دارای ویژگی «وزن کم» است.
         *
         * بنابراین باید ۱۰ امتیاز جریمه شود.
         *
         * محصولات دیگر چنین ویژگی‌ای ندارند.
         */


        const constraintNeed = {

          category:
            "mobile",

          intent:
            "purchase",

          budget: {

            min: null,

            max:
              15000000

          },

          priorities: [],

          requirements: [],

          constraints: [

            {
              id:
                "constraints",

              value:
                "وزن کم"

            }

          ],

          context: {

            usage: ""

          }

        };


        const constraintResults =
          window.DigiYarProductScoring
            .recommend(
              constraintNeed
            );


        const constraintTest =
          document.createElement(
            "div"
          );


        constraintTest.className =
          "test";


        constraintTest.innerHTML = `

          <h3>
            بودجه: ۱۵٬۰۰۰٬۰۰۰ تومان
          </h3>

          <p>
            محدودیت:
            <strong>وزن کم</strong>
          </p>

          <p>
            تعداد پیشنهادها:
            ${constraintResults.length}
          </p>

          <p>
            انتظار:
            محصول «موبایل باتری‌محور» باید به دلیل
            داشتن ویژگی «وزن کم»، ۱۰ امتیاز جریمه شود.
          </p>

          <pre>${JSON.stringify(
            constraintResults.map(
              function (product) {

                return {

                  name:
                    product.name,

                  price:
                    product.price,

                  score:
                    product.score,

                  features:
                    product.features,

                  store:
                    product.store,

                  url:
                    product.url

                };

              }
            ),
            null,
            2
          )}</pre>

        `;


        output.appendChild(
          constraintTest
        );


        /*
         * =================================================
         * بررسی خودکار نتیجه Constraint
         * =================================================
         */

        const batteryProduct =
          constraintResults.find(
            function (product) {

              return (
                product.id ===
                "mobile-003"
              );

            }
          );


        const verification =
          document.createElement(
            "div"
          );


        verification.className =
          "test";


        if (
          batteryProduct &&
          batteryProduct.score === 20
        ) {

          verification.innerHTML = `

            <p class="success">
              ✓ Constraint با موفقیت اعمال شد.
            </p>

            <p>
              محصول «موبایل باتری‌محور» دارای
              ویژگی «وزن کم» است و امتیاز آن
              از ۳۰ به ۲۰ کاهش یافته است.
            </p>

          `;

        } else {

          verification.innerHTML = `

            <p class="error">
              ✗ نتیجه Constraint مطابق انتظار نیست.
            </p>

            <p>
              امتیاز فعلی موبایل باتری‌محور:
              ${
                batteryProduct
                  ? batteryProduct.score
                  : "محصول پیدا نشد"
              }
            </p>

          `;

        }


        output.appendChild(
          verification
        );


      }
    );

})();

</script>

</body>

</html>
