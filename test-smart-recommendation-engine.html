<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DigiYar V4 — Smart Recommendation Engine Test
  </title>

  <style>

    body {
      font-family: Tahoma, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #172033;
    }

    .summary {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
      background: white;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c62828;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f0f2f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

  </style>

</head>


<body>

  <h1>
    تست Smart Recommendation Engine — V4
  </h1>

  <p>
    <strong>
      Build 9 — Alpha 1
    </strong>
  </p>

  <div
    id="summary"
    class="summary"
  >
    در حال اجرای تست‌ها...
  </div>

  <div id="results"></div>


  <!-- =====================================================
       Dependencies
       ترتیب بسیار مهم است:
       Product Data
       ↓
       Product Scoring
       ↓
       Smart Recommendation
       ===================================================== -->

  <script src="./js/product-data.js"></script>

  <script src="./js/product-scoring.js"></script>

  <script src="./js/smart-recommendation-engine.js"></script>


  <script>

    "use strict";


    const results = [];


    /* =====================================================
       Test Helper
       ===================================================== */

    function addResult(
      name,
      passed,
      data
    ) {

      results.push({

        name:
          name,

        passed:
          passed,

        data:
          data

      });

    }


    /* =====================================================
       Render Results
       ===================================================== */

    function renderResults() {

      const container =
        document.getElementById(
          "results"
        );


      container.innerHTML = "";


      results.forEach(
        function (
          test,
          index
        ) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "test";


          div.innerHTML = `

            <h3 class="${
              test.passed
                ? "pass"
                : "fail"
            }">

              ${
                test.passed
                  ? "✅ PASS"
                  : "❌ FAIL"
              }

              — سناریو ${index + 1}

            </h3>


            <strong>
              ${test.name}
            </strong>


            <pre>${JSON.stringify(
              test.data,
              null,
              2
            )}</pre>

          `;


          container.appendChild(
            div
          );

        }
      );


      const passed =
        results.filter(
          function (item) {

            return item.passed;

          }
        ).length;


      const total =
        results.length;


      const summary =
        document.getElementById(
          "summary"
        );


      if (
        passed === total
      ) {

        summary.className =
          "summary pass";


        summary.innerHTML =
          `🎉 ALL TESTS PASSED — ${passed} از ${total}`;

      }

      else {

        summary.className =
          "summary fail";


        summary.innerHTML =
          `⚠️ SOME TESTS FAILED — ${passed} از ${total}`;

      }

    }


    /* =====================================================
       Scenario 1
       Dependency Check
       ===================================================== */

    try {

      const dependencies = {

        productData:
          typeof DigiYarProductData !==
          "undefined",

        productScoring:
          typeof DigiYarProductScoring !==
          "undefined",

        smartRecommendation:
          typeof DigiyarSmartRecommendation !==
          "undefined"

      };


      const passed =
        Object.values(
          dependencies
        ).every(
          Boolean
        );


      addResult(

        "بررسی وجود Product Data، Product Scoring و Smart Recommendation",

        passed,

        dependencies

      );

    }

    catch (error) {

      addResult(

        "بررسی Dependencyها",

        false,

        {
          error:
            error.message ||
            String(error)
        }

      );

    }


    /* =====================================================
       Scenario 2
       Need Ready Check
       ===================================================== */

    try {

      const incompleteNeed = {

        category:
          "mobile",

        budget:
          null,

        usage:
          [],

        ready:
          false,

        nextAction:
          "ask_user"

      };


      const completeNeed = {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            15000000

        },

        usage: [

          "photography"

        ],

        ready:
          true,

        nextAction:
          "retrieve_products"

      };


      const incompleteResult =
        DigiyarSmartRecommendation
          .isNeedReady(
            incompleteNeed
          );


      const completeResult =
        DigiyarSmartRecommendation
          .isNeedReady(
            completeNeed
          );


      const passed =

        incompleteResult ===
          false

        &&

        completeResult ===
          true;


      addResult(

        "تشخیص صحیح Need ناقص و کامل",

        passed,

        {

          incomplete:
            incompleteResult,

          complete:
            completeResult

        }

      );

    }

    catch (error) {

      addResult(

        "تشخیص صحیح Need ناقص و کامل",

        false,

        {
          error:
            error.message ||
            String(error)
        }

      );

    }


    /* =====================================================
       Scenario 3
       Incomplete Need
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget:
          null,

        usage:
          [],

        ready:
          false,

        nextAction:
          "ask_user"

      };


      const result =
        DigiyarSmartRecommendation
          .recommend(
            need
          );


      const passed =

        result.status ===
          "waiting_for_answer"

        &&

        Array.isArray(
          result.products
        )

        &&

        result.products.length ===
          0

        &&

        Array.isArray(
          result.recommendations
        )

        &&

        result.recommendations.length ===
          0;


      addResult(

        "جلوگیری از Recommendation برای Need ناقص",

        passed,

        result

      );

    }

    catch (error) {

      addResult(

        "جلوگیری از Recommendation برای Need ناقص",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 4
       Smart Ranking
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            15000000

        },

        usage: [

          "photography"

        ],

        priorities: [

          "دوربین"

        ],

        requirements: [

          {

            value:
              "دوربین"

          }

        ],

        constraints: [],

        ready:
          true,

        nextAction:
          "retrieve_products"

      };


      const result =
        DigiyarSmartRecommendation
          .recommend(
            need
          );


      const topProduct =
        result.recommendations &&
        result.recommendations.length
          ? result.recommendations[0]
          : null;


      const passed =

        (
          result.status ===
          "recommendations_ready"
        )

        &&

        Array.isArray(
          result.recommendations
        )

        &&

        result.recommendations.length >
          0

        &&

        topProduct !== null

        &&

        topProduct.name ===
          "موبایل دوربین‌محور"

        &&

        Number(
          topProduct.score
        ) > 0;


      addResult(

        "رتبه‌بندی هوشمند محصولات بر اساس Need",

        passed,

        {

          status:
            result.status,

          topProduct:
            topProduct,

          recommendations:
            result.recommendations

        }

      );

    }

    catch (error) {

      addResult(

        "رتبه‌بندی هوشمند محصولات بر اساس Need",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 5
       Budget Priority
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            15000000

        },

        usage:
          [],

        priorities: [

          "دوربین"

        ],

        requirements: [

          {

            value:
              "دوربین"

          }

        ],

        constraints: [],

        ready:
          true,

        nextAction:
          "retrieve_products"

      };


      const result =
        DigiyarSmartRecommendation
          .recommend(
            need
          );


      const recommendations =
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const topProduct =
        recommendations.length
          ? recommendations[0]
          : null;


      const allInsideBudget =
        recommendations.every(
          function (product) {

            return Number(
              product.price || 0
            ) <= 15000000;

          }
        );


      const passed =

        topProduct !== null

        &&

        allInsideBudget

        &&

        topProduct.name ===
          "موبایل دوربین‌محور";


      addResult(

        "اولویت‌دهی صحیح به محصولات داخل بودجه",

        passed,

        {

          topProduct:
            topProduct,

          recommendations:
            recommendations

        }

      );

    }

    catch (error) {

      addResult(

        "اولویت‌دهی صحیح به محصولات داخل بودجه",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 6
       Recommendation Limit
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            15000000

        },

        usage:
          [],

        priorities: [

          "ارزش خرید"

        ],

        requirements: [],

        constraints: [],

        ready:
          true,

        nextAction:
          "retrieve_products"

      };


      const result =
        DigiyarSmartRecommendation
          .recommend(
            need,
            {
              limit:
                2
            }
          );


      const recommendations =
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const passed =

        recommendations.length >
          0

        &&

        recommendations.length <=
          2;


      addResult(

        "اعمال صحیح محدودیت تعداد پیشنهادها",

        passed,

        {

          recommendationCount:
            recommendations.length,

          recommendations:
            recommendations

        }

      );

    }

    catch (error) {

      addResult(

        "اعمال صحیح محدودیت تعداد پیشنهادها",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 7
       Explanation
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          max:
            15000000

        },

        usage: [

          "photography"

        ],

        priorities: [

          "دوربین"

        ],

        requirements: [

          {

            value:
              "دوربین"

          }

        ],

        constraints: [],

        ready:
          true

      };


      const product = {

        id:
          "test-product",

        name:
          "محصول تست",

        category:
          "mobile",

        price:
          14000000,

        features: [

          "دوربین",

          "5G"

        ]

      };


      const explanation =
        DigiyarSmartRecommendation
          .explain(
            product,
            need
          );


      const passed =

        typeof explanation ===
          "string"

        &&

        explanation.trim().length >
          0;


      addResult(

        "تولید توضیح قابل استفاده برای پیشنهاد",

        passed,

        {

          explanation:
            explanation

        }

      );

    }

    catch (error) {

      addResult(

        "تولید توضیح قابل استفاده برای پیشنهاد",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Render
       ===================================================== */

    renderResults();

  </script>

</body>

</html>
