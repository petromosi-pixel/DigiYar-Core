<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DigiYar V4 — Product Retrieval Integration Test
  </title>

  <style>

    body {
      font-family: Tahoma, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #172033;
    }

    .summary {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
      background: white;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c62828;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f0f2f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

  </style>

</head>


<body>

  <h1>
    تست Product Retrieval Integration — V4
  </h1>

  <p>
    <strong>
      Build 7 — Alpha 1
    </strong>
  </p>

  <div
    id="summary"
    class="summary"
  >
    در حال اجرای تست‌ها...
  </div>

  <div id="results"></div>


  <!-- =====================================================
       Dependencies
       ===================================================== -->

  <script src="./js/product-retrieval.js"></script>

  <script src="./js/product-retrieval-integration.js"></script>


  <script>

    "use strict";


    /*
     * کل تست‌ها داخل یک تابع async اجرا می‌شوند
     * تا استفاده از await در مرورگر معتبر باشد.
     */

    async function runTests() {

      const results = [];


      /* ===================================================
         Test Helper
         =================================================== */

      function addResult(
        name,
        passed,
        data
      ) {

        results.push({

          name:
            name,

          passed:
            passed,

          data:
            data

        });

      }


      /* ===================================================
         Render
         =================================================== */

      function renderResults() {

        const container =
          document.getElementById(
            "results"
          );


        container.innerHTML = "";


        results.forEach(
          function (
            test,
            index
          ) {

            const div =
              document.createElement(
                "div"
              );


            div.className =
              "test";


            div.innerHTML = `

              <h3 class="${
                test.passed
                  ? "pass"
                  : "fail"
              }">

                ${
                  test.passed
                    ? "✅ PASS"
                    : "❌ FAIL"
                }

                — سناریو ${index + 1}

              </h3>


              <strong>
                ${test.name}
              </strong>


              <pre>${JSON.stringify(
                test.data,
                null,
                2
              )}</pre>

            `;


            container.appendChild(
              div
            );

          }
        );


        const passed =
          results.filter(
            function (item) {

              return item.passed;

            }
          ).length;


        const total =
          results.length;


        const summary =
          document.getElementById(
            "summary"
          );


        if (
          passed === total
        ) {

          summary.className =
            "summary pass";


          summary.innerHTML =
            `🎉 ALL TESTS PASSED — ${passed} از ${total}`;

        }

        else {

          summary.className =
            "summary fail";


          summary.innerHTML =
            `⚠️ SOME TESTS FAILED — ${passed} از ${total}`;

        }

      }


      /* ===================================================
         Scenario 1
         Dependency Check
         =================================================== */

      try {

        const dependencies = {

          productRetrieval:
            typeof DigiYarProductRetrieval !==
            "undefined",

          productRetrievalIntegration:
            typeof DigiyarProductRetrievalIntegration !==
            "undefined"

        };


        const passed =
          Object.values(
            dependencies
          ).every(
            Boolean
          );


        addResult(

          "بررسی وجود Retrieval Engine و Integration",

          passed,

          dependencies

        );

      }

      catch (error) {

        addResult(

          "بررسی Dependencyها",

          false,

          {
            error:
              error.message ||
              String(error)
          }

        );

      }


      /* ===================================================
         Scenario 2
         Incomplete Need
         =================================================== */

      try {

        const need = {

          category:
            "mobile",

          budget:
            null,

          usage:
            [],

          ready:
            false,

          nextAction:
            "ask_user"

        };


        const result =
          await DigiyarProductRetrievalIntegration
            .retrieve(
              need
            );


        const passed =

          result.status ===
            "waiting_for_answer"

          &&

          Array.isArray(
            result.products
          )

          &&

          result.products.length ===
            0;


        addResult(

          "Need ناقص نباید وارد Retrieval شود",

          passed,

          result

        );

      }

      catch (error) {

        addResult(

          "Need ناقص نباید وارد Retrieval شود",

          false,

          {
            error:
              error.message ||
              String(error)
          }

        );

      }


      /* ===================================================
         Scenario 3
         Need Ready Check
         =================================================== */

      try {

        const incompleteNeed = {

          category:
            "mobile",

          budget:
            null,

          usage:
            [],

          ready:
            false

        };


        const completeNeed = {

          category:
            "mobile",

          budget: {

            min:
              null,

            max:
              15000000

          },

          usage: [

            "photography"

          ],

          ready:
            true,

          nextAction:
            "retrieve_products"

        };


        const incompleteResult =
          DigiyarProductRetrievalIntegration
            .isNeedReady(
              incompleteNeed
            );


        const completeResult =
          DigiyarProductRetrievalIntegration
            .isNeedReady(
              completeNeed
            );


        const passed =

          incompleteResult ===
            false

          &&

          completeResult ===
            true;


        addResult(

          "تشخیص صحیح Need ناقص و کامل",

          passed,

          {

            incomplete:
              incompleteResult,

            complete:
              completeResult

          }

        );

      }

      catch (error) {

        addResult(

          "تشخیص صحیح Need ناقص و کامل",

          false,

          {
            error:
              error.message ||
              String(error)
          }

        );

      }


      /* ===================================================
         Scenario 4
         Query Builder
         =================================================== */

      try {

        const need = {

          category:
            "mobile",

          budget: {

            max:
              15000000

          },

          usage: [

            "photography"

          ],

          decisionElements: [

            {

              field:
                "camera",

              type:
                "requirement"

            }

          ],

          ready:
            true,

          nextAction:
            "retrieve_products"

        };


        const query =
          DigiyarProductRetrievalIntegration
            .buildQuery(
              need
            );


        const passed =

          query.includes(
            "mobile"
          )

          &&

          query.includes(
            "photography"
          )

          &&

          query.includes(
            "camera"
          );


        addResult(

          "ساخت صحیح Retrieval Query از Need",

          passed,

          {

            query:
              query

          }

        );

      }

      catch (error) {

        addResult(

          "ساخت صحیح Retrieval Query از Need",

          false,

          {
            error:
              error.message ||
              String(error)
          }

        );

      }


      /* ===================================================
         Scenario 5
         Local Retrieval
         =================================================== */

      try {

        const need = {

          category:
            "mobile",

          budget: {

            min:
              null,

            max:
              15000000

          },

          usage: [

            "photography"

          ],

          decisionElements: [

            {

              field:
                "camera",

              type:
                "requirement",

              importance:
                8

            }

          ],

          tradeoffs: [],

          unknown: [],

          ready:
            true,

          nextAction:
            "retrieve_products"

        };


        const result =
          await DigiyarProductRetrievalIntegration
            .retrieve(

              need,

              {
                remote:
                  false
              }

            );


        const passed =

          result.status ===
            "products_retrieved"

          &&

          result.query.includes(
            "mobile"
          )

          &&

          Array.isArray(
            result.products
          )

          &&

          result.error ===
            null;


        addResult(

          "Retrieval موفق با Local Fallback",

          passed,

          {

            status:
              result.status,

            query:
              result.query,

            count:
              result.count,

            products:
              result.products,

            error:
              result.error

          }

        );

      }

      catch (error) {

        addResult(

          "Retrieval موفق با Local Fallback",

          false,

          {
            error:
              error.message ||
              String(error)
          }

        );

      }


      /* ===================================================
         Scenario 6
         Result Structure
         =================================================== */

      try {

        const need = {

          category:
            "mobile",

          budget: {

            max:
              15000000

          },

          usage: [

            "photography"

          ],

          ready:
            true,

          nextAction:
            "retrieve_products"

        };


        const result =
          await DigiyarProductRetrievalIntegration
            .retrieve(

              need,

              {
                remote:
                  false
              }

            );


        const passed =

          typeof result ===
            "object"

          &&

          result.version ===
            "4.0.0-alpha.1"

          &&

          typeof result.status ===
            "string"

          &&

          Array.isArray(
            result.products
          )

          &&

          typeof result.query ===
            "string"

          &&

          "error" in result;


        addResult(

          "ساختار استاندارد خروجی Integration",

          passed,

          {

            version:
              result.version,

            status:
              result.status,

            query:
              result.query,

            count:
              result.count,

            productsCount:
              Array.isArray(
                result.products
              )
                ? result.products.length
                : null,

            error:
              result.error

          }

        );

      }

      catch (error) {

        addResult(

          "ساختار استاندارد خروجی Integration",

          false,

          {
            error:
              error.message ||
              String(error)
          }

        );

      }


      /* ===================================================
         Scenario 7
         Need Preservation
         =================================================== */

      try {

        const need = {

          version:
            "4.0.0-alpha.3",

          category:
            "mobile",

          intent:
            "purchase",

          budget: {

            min:
              null,

            max:
              15000000,

            type:
              "hard_constraint",

            source:
              "declared"

          },

          usage: [

            "photography"

          ],

          decisionElements: [

            {

              field:
                "camera",

              type:
                "requirement",

              importance:
                8

            }

          ],

          tradeoffs: [],

          unknown: [],

          confidence:
            1,

          ready:
            true,

          nextAction:
            "retrieve_products"

        };


        const result =
          await DigiyarProductRetrievalIntegration
            .retrieve(

              need,

              {

                remote:
                  false

              }

            );


        const passed =

          result.need.category ===
            "mobile"

          &&

          result.need.intent ===
            "purchase"

          &&

          result.need.budget.max ===
            15000000

          &&

          result.need.usage.includes(
            "photography"
          )

          &&

          result.need.ready ===
            true;


        addResult(

          "حفظ کامل Need پس از Retrieval",

          passed,

          {

            category:
              result.need.category,

            intent:
              result.need.intent,

            budget:
              result.need.budget,

            usage:
              result.need.usage,

            ready:
              result.need.ready

          }

        );

      }

      catch (error) {

        addResult(

          "حفظ کامل Need پس از Retrieval",

          false,

          {
            error:
              error.message ||
              String(error)
          }

        );

      }


      /* ===================================================
         Render
         =================================================== */

      renderResults();

    }


    /* =====================================================
       Start Tests
       ===================================================== */

    runTests();

  </script>

</body>

</html>
