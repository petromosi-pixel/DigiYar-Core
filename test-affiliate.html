<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DigiYar Affiliate Test</title>

  <style>

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      padding: 20px;
      line-height: 1.8;
    }

    .box {
      max-width: 760px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
    }

    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #ff8a00;
      color: #ffffff;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
    }

    .product {
      margin-top: 12px;
      padding: 14px;
      background: #f7f8fa;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      background: #eeeeee;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
    }

  </style>

</head>


<body>

  <div class="box">

    <h2>
      تست اتصال Product Scoring و Affiliate
    </h2>

    <p>
      این تست بررسی می‌کند که هر محصول بر اساس فروشگاه
      خودش لینک خروجی مناسب دریافت می‌کند.
    </p>


    <button
      onclick="testProducts()"
    >
      اجرای تست
    </button>


    <div
      id="result"
      class="result"
    ></div>

  </div>


  <!-- ترتیب مهم است -->

  <script src="js/affiliate.js"></script>

  <script src="js/product-scoring.js"></script>


  <script>

    function testProducts() {

      const result =
        document.getElementById(
          "result"
        );


      /*
       * نیاز آزمایشی
       */

      const testNeed = {

        category: "mobile",

        budget: {

          max:
            500000000

        },

        priorities: [],

        requirements: [],

        constraints: [],

        context: {

          usage: ""

        }

      };


      /*
       * دریافت پیشنهادها
       */

      const products =
        DigiYarProductScoring
          .recommend(
            testNeed
          );


      if (!products.length) {

        result.innerHTML = `

          <p class="error">
            هیچ محصولی برای تست پیدا نشد.
          </p>

        `;

        return;

      }


      /*
       * نمایش نتایج
       */

      result.innerHTML = products
        .map(
          function (product) {

            const isAffiliate =
              product.url.includes(
                "aflo.ir"
              );


            return `

              <div class="product">

                <strong>
                  ${product.name}
                </strong>

                <br>

                فروشگاه:
                ${product.store}

                <br>

                قیمت:
                ${new Intl.NumberFormat(
                  "fa-IR"
                ).format(
                  product.price
                )}
                تومان

                <br>

                امتیاز:
                ${product.score}%

                <br><br>

                <span
                  class="${
                    isAffiliate
                      ? "success"
                      : "error"
                  }"
                >

                  ${
                    isAffiliate
                      ? "✓ لینک افیلیت ساخته شد"
                      : "✗ لینک افیلیت ساخته نشد"
                  }

                </span>

                <pre>
${product.url}
                </pre>

              </div>

            `;

          }
        )
        .join("");

    }

  </script>

</body>

</html>
