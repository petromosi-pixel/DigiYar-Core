<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تست API دیجی‌کالا - دیجی‌یار V3</title>

  <style>

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      padding: 20px;
      line-height: 1.8;
    }

    .box {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #101c35;
      color: #fff;
      font-family: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f1f2f4;
    }

    .success {
      background: #e9f8ef;
    }

    .warning {
      background: #fff5df;
    }

    .error {
      background: #fdecec;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f7f8fa;
      border-radius: 12px;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      background: #eef0f3;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .url {
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>
    تست مستقیم API دیجی‌کالا
  </h1>

  <p>
    این تست فقط بررسی می‌کند که مرورگر می‌تواند
    مستقیماً به endpoint دیجی‌کالا دسترسی پیدا کند یا خیر.
  </p>

  <div class="result">

    <strong>
      Endpoint:
    </strong>

    <div class="url">
      https://api.digikala.com/v1/search/?q=%D9%85%D9%88%D8%A8%D8%A7%DB%8C%D9%84
    </div>

  </div>


  <button
    id="runTest"
    type="button"
  >
    اجرای تست API
  </button>


  <div
    id="status"
    class="status"
  >
    آماده اجرای تست
  </div>


  <div id="output"></div>

</div>


<script>

(function () {

  "use strict";


  const endpoint =
    "https://api.digikala.com/v1/search/?q=" +
    encodeURIComponent("موبایل");


  const runButton =
    document.getElementById("runTest");


  const status =
    document.getElementById("status");


  const output =
    document.getElementById("output");


  function setStatus(
    message,
    type
  ) {

    status.textContent =
      message;

    status.className =
      "status " +
      (type || "");

  }


  function escapeHTML(value) {

    return String(
      value ?? ""
    ).replace(
      /[&<>"']/g,
      function (character) {

        const entities = {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        };

        return entities[character];

      }
    );

  }


  async function runTest() {

    output.innerHTML = "";

    runButton.disabled = true;


    setStatus(
      "در حال اتصال مستقیم به API دیجی‌کالا...",
      ""
    );


    const startedAt =
      performance.now();


    try {

      const response =
        await fetch(
          endpoint,
          {
            method: "GET",

            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      const elapsed =
        Math.round(
          performance.now() -
          startedAt
        );


      const result =
        document.createElement(
          "div"
        );


      result.className =
        "result";


      result.innerHTML = `

        <strong>
          HTTP Status:
        </strong>

        ${escapeHTML(
          response.status
        )}

        <br>

        <strong>
          OK:
        </strong>

        ${escapeHTML(
          response.ok
        )}

        <br>

        <strong>
          زمان پاسخ:
        </strong>

        ${escapeHTML(
          elapsed
        )}
        ms

      `;


      output.appendChild(
        result
      );


      if (!response.ok) {

        setStatus(
          "⚠ API قابل دسترسی بود، اما HTTP Status موفق نبود.",
          "warning"
        );

        return;

      }


      const data =
        await response.json();


      setStatus(
        "✓ مرورگر مستقیماً از API دیجی‌کالا پاسخ دریافت کرد.",
        "success"
      );


      const raw =
        document.createElement(
          "div"
        );


      raw.className =
        "result";


      raw.innerHTML = `

        <h3>
          پاسخ خام API
        </h3>

        <pre>
${escapeHTML(
  JSON.stringify(
    data,
    null,
    2
  )
)}
        </pre>

      `;


      output.appendChild(
        raw
      );


    } catch (error) {

      const elapsed =
        Math.round(
          performance.now() -
          startedAt
        );


      setStatus(
        "✗ مرورگر نتوانست مستقیماً به API دیجی‌کالا متصل شود.",
        "error"
      );


      const errorBox =
        document.createElement(
          "div"
        );


      errorBox.className =
        "result";


      errorBox.innerHTML = `

        <strong>
          نوع خطا:
        </strong>

        <div class="result">

          ${escapeHTML(
            error &&
            error.name
              ? error.name
              : "UnknownError"
          )}

        </div>


        <strong>
          جزئیات:
        </strong>

        <pre>
${escapeHTML(
  error &&
  error.message
    ? error.message
    : error
)}
        </pre>


        <strong>
          زمان تا خطا:
        </strong>

        ${escapeHTML(
          elapsed
        )}
        ms

      `;


      output.appendChild(
        errorBox
      );

    } finally {

      runButton.disabled =
        false;

    }

  }


  runButton.addEventListener(
    "click",
    runTest
  );


})();

</script>

</body>

</html>
