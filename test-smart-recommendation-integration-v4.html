<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DigiYar V4 — Smart Recommendation Quality Test
  </title>

  <style>

    body {
      font-family: Tahoma, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #172033;
    }

    .summary {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
      background: white;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c62828;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f0f2f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }

    .flow {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <h1>
    تست Quality — Smart Recommendation Engine V4
  </h1>

  <p>
    <strong>
      Build 10 — Recommendation Quality Validation
    </strong>
  </p>


  <div class="flow">
    Need
    ↓
    Recommendation
    ↓
    Ranking Quality
    ↓
    Budget
    ↓
    Priority / Requirement / Constraint
    ↓
    Explanation
  </div>


  <div
    id="summary"
    class="summary"
  >
    در حال اجرای تست‌ها...
  </div>


  <div id="results"></div>


  <!-- =====================================================
       Dependencies
       ===================================================== -->

  <script src="./js/product-data.js"></script>

  <script src="./js/product-scoring.js"></script>

  <script src="./js/smart-recommendation-engine.js"></script>


  <script>

    "use strict";


    const results = [];


    /* =====================================================
       Helpers
       ===================================================== */

    function addResult(
      name,
      passed,
      data
    ) {

      results.push({

        name:
          name,

        passed:
          passed,

        data:
          data

      });

    }


    function getProduct(
      item
    ) {

      if (
        item &&
        item.product
      ) {

        return item.product;

      }

      return item || null;

    }


    function getScore(
      item
    ) {

      if (
        item &&
        typeof item.score === "number"
      ) {

        return item.score;

      }

      return 0;

    }


    function renderResults() {

      const container =
        document.getElementById(
          "results"
        );


      container.innerHTML = "";


      results.forEach(
        function (
          test,
          index
        ) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "test";


          div.innerHTML = `

            <h3 class="${
              test.passed
                ? "pass"
                : "fail"
            }">

              ${
                test.passed
                  ? "✅ PASS"
                  : "❌ FAIL"
              }

              — سناریو ${index + 1}

            </h3>

            <strong>
              ${test.name}
            </strong>

            <pre>${JSON.stringify(
              test.data,
              null,
              2
            )}</pre>

          `;


          container.appendChild(
            div
          );

        }
      );


      const passed =
        results.filter(
          function (item) {

            return item.passed;

          }
        ).length;


      const total =
        results.length;


      const summary =
        document.getElementById(
          "summary"
        );


      if (
        passed === total
      ) {

        summary.className =
          "summary pass";


        summary.innerHTML =
          `🎉 ALL QUALITY TESTS PASSED — ${passed} از ${total}`;

      }

      else {

        summary.className =
          "summary fail";


        summary.innerHTML =
          `⚠️ QUALITY TEST RESULT — ${passed} از ${total}`;

      }

    }


    /* =====================================================
       Shared Products
       ===================================================== */

    const products =
      DigiYarProductData.getAll();


    /* =====================================================
       Scenario 1
       Incomplete Need
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget:
          null,

        usage: [],

        priorities: [],

        requirements: [],

        constraints: [],

        ready:
          false,

        nextAction:
          "ask_user"

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products
        );


      const passed =

        result.status ===
          "waiting_for_answer"

        &&

        result.count ===
          0

        &&

        Array.isArray(
          result.recommendations
        )

        &&

        result.recommendations.length ===
          0;


      addResult(

        "Need ناقص نباید Recommendation تولید کند",

        passed,

        {

          status:
            result.status,

          count:
            result.count,

          recommendations:
            result.recommendations

        }

      );

    }

    catch (error) {

      addResult(

        "Need ناقص نباید Recommendation تولید کند",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 2
       Budget Filtering
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            10000000

        },

        usage: [],

        priorities: [],

        requirements: [],

        constraints: [],

        ready:
          true

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products
        );


      const recommendations =
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const insideBudget =
        recommendations.every(
          function (item) {

            const product =
              getProduct(item);


            return (
              Number(
                product &&
                product.price || 0
              ) <=
              10000000
            );

          }
        );


      const passed =

        result.status ===
          "recommendations_ready"

        &&

        recommendations.length >
          0

        &&

        insideBudget;


      addResult(

        "حذف محصولات خارج از سقف بودجه",

        passed,

        {

          budgetMax:
            10000000,

          insideBudget:
            insideBudget,

          recommendations:
            recommendations

        }

      );

    }

    catch (error) {

      addResult(

        "حذف محصولات خارج از سقف بودجه",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 3
       Priority
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          max:
            15000000

        },

        usage: [],

        priorities: [

          "دوربین"

        ],

        requirements: [],

        constraints: [],

        ready:
          true

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products
        );


      const top =
        result.recommendations &&
        result.recommendations.length
          ? getProduct(
              result.recommendations[0]
            )
          : null;


      const passed =

        top !==
          null

        &&

        top.id ===
          "mobile-002"

        &&

        getScore(
          result.recommendations[0]
        ) >
          30;


      addResult(

        "Priority باید روی Ranking اثر بگذارد",

        passed,

        {

          priority:
            "دوربین",

          topProduct:
            top,

          topScore:
            top
              ? getScore(
                  result.recommendations[0]
                )
              : 0

        }

      );

    }

    catch (error) {

      addResult(

        "Priority باید روی Ranking اثر بگذارد",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 4
       Requirement
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          max:
            15000000

        },

        usage: [],

        priorities: [],

        requirements: [

          {

            value:
              "دوربین"

          }

        ],

        constraints: [],

        ready:
          true

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products
        );


      const top =
        result.recommendations &&
        result.recommendations.length
          ? getProduct(
              result.recommendations[0]
            )
          : null;


      const passed =

        top !==
          null

        &&

        top.id ===
          "mobile-002"

        &&

        getScore(
          result.recommendations[0]
        ) >
          30;


      addResult(

        "Requirement باید روی Ranking اثر بگذارد",

        passed,

        {

          requirement:
            "دوربین",

          topProduct:
            top,

          topScore:
            top
              ? getScore(
                  result.recommendations[0]
                )
              : 0

        }

      );

    }

    catch (error) {

      addResult(

        "Requirement باید روی Ranking اثر بگذارد",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 5
       Constraint
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          max:
            15000000

        },

        usage: [],

        priorities: [],

        requirements: [],

        constraints: [

          {

            value:
              "5G"

          }

        ],

        ready:
          true

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products
        );


      const recommendations =
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const target =
        recommendations.find(
          function (item) {

            const product =
              getProduct(item);


            return (
              product &&
              product.id ===
                "mobile-002"
            );

          }
        );


      const targetScore =
        target
          ? getScore(target)
          : null;


      const passed =

        recommendations.length >
          0

        &&

        target !==
          undefined

        &&

        targetScore <
          30;


      addResult(

        "Constraint باید محصول متعارض را جریمه کند",

        passed,

        {

          constraint:
            "5G",

          targetProduct:
            target
              ? getProduct(target)
              : null,

          targetScore:
            targetScore,

          note:
            "در این تست وجود 5G به‌عنوان Constraint عمداً محصول را جریمه می‌کند."

        }

      );

    }

    catch (error) {

      addResult(

        "Constraint باید محصول متعارض را جریمه کند",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 6
       Recommendation Limit
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          max:
            15000000

        },

        usage: [],

        priorities: [],

        requirements: [],

        constraints: [],

        ready:
          true

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products,
          {
            limit:
              1
          }
        );


      const recommendations =
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      const passed =

        recommendations.length ===
          1;


      addResult(

        "کنترل دقیق Limit پیشنهادها",

        passed,

        {

          requestedLimit:
            1,

          actualCount:
            recommendations.length,

          recommendations:
            recommendations

        }

      );

    }

    catch (error) {

      addResult(

        "کنترل دقیق Limit پیشنهادها",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 7
       Ranking Order
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          max:
            15000000

        },

        usage: [],

        priorities: [

          "دوربین"

        ],

        requirements: [],

        constraints: [],

        ready:
          true

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products
        );


      const recommendations =
        Array.isArray(
          result.recommendations
        )
          ? result.recommendations
          : [];


      let descending =
        true;


      for (
        let i = 1;
        i < recommendations.length;
        i++
      ) {

        const previous =
          getScore(
            recommendations[i - 1]
          );


        const current =
          getScore(
            recommendations[i]
          );


        if (
          current >
          previous
        ) {

          descending =
            false;

          break;

        }

      }


      const passed =

        recommendations.length >
          0

        &&

        descending;


      addResult(

        "ترتیب Recommendationها باید بر اساس Score نزولی باشد",

        passed,

        {

          descending:
            descending,

          scores:
            recommendations.map(
              getScore
            )

        }

      );

    }

    catch (error) {

      addResult(

        "ترتیب Recommendationها باید بر اساس Score نزولی باشد",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 8
       Explanation
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          max:
            15000000

        },

        usage: [],

        priorities: [

          "دوربین"

        ],

        requirements: [],

        constraints: [],

        ready:
          true

      };


      const result =
        DigiyarSmartRecommendationEngine.recommend(
          need,
          products
        );


      const top =
        result.recommendations &&
        result.recommendations.length
          ? result.recommendations[0]
          : null;


      const explanation =
        top
          ? DigiyarSmartRecommendationEngine.explain(
              top
            )
          : "";


      const passed =

        typeof explanation ===
          "string"

        &&

        explanation.trim().length >
          0;


      addResult(

        "Explanation باید برای Recommendation تولید شود",

        passed,

        {

          explanation:
            explanation,

          topProduct:
            top
              ? getProduct(top)
              : null

        }

      );

    }

    catch (error) {

      addResult(

        "Explanation باید برای Recommendation تولید شود",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Scenario 9
       Need Immutability
       ===================================================== */

    try {

      const need = {

        category:
          "mobile",

        budget: {

          min:
            null,

          max:
            15000000

        },

        usage: [

          "photography"

        ],

        priorities: [

          "دوربین"

        ],

        requirements: [

          {

            value:
              "دوربین"

          }

        ],

        constraints: [],

        ready:
          true,

        nextAction:
          "retrieve_products"

      };


      const before =
        JSON.stringify(
          need
        );


      DigiyarSmartRecommendationEngine.recommend(
        need,
        products
      );


      const after =
        JSON.stringify(
          need
        );


      const passed =
        before ===
        after;


      addResult(

        "Engine نباید Need اصلی را تغییر دهد",

        passed,

        {

          unchanged:
            passed,

          before:
            JSON.parse(before),

          after:
            JSON.parse(after)

        }

      );

    }

    catch (error) {

      addResult(

        "Engine نباید Need اصلی را تغییر دهد",

        false,

        {

          error:
            error.message ||
            String(error)

        }

      );

    }


    /* =====================================================
       Final Render
       ===================================================== */

    renderResults();

  </script>


</body>

</html>
