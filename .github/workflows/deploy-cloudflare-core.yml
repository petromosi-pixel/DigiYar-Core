name: Deploy DigiYar V5 Worker

on:
  push:
    branches: [v5]
    paths:
      - 'worker.js'
      - 'js/data-ingestion-v5.1.js'
      - 'js/search-core-v5.1.js'
      - 'js/v5-price-availability-resolver.js'
      - 'js/v5-offer-affiliate-engine.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-core.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout V5
        uses: actions/checkout@v4
        with:
          ref: v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Wrangler
        run: wrangler --version

      - name: Deploy DigiYar V5 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Wait for live Worker readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              -H 'accept: application/json' \
              'https://digiyar-v5.petromosi.workers.dev/health' \
              | grep -q '"status":"ok"'; then
              echo "Live Worker is ready (attempt ${attempt})."
              exit 0
            fi
            echo "Worker not ready yet (attempt ${attempt}/30); waiting 2s..."
            sleep 2
          done
          echo 'Live Worker did not become ready after deployment.'
          exit 1

      - name: Run V5.1 Revenue E2E gate
        run: npm run test:v5.1:revenue

      - name: Run V5.1 Full Mission E2E gate
        run: npm run test:v5.1:mission
