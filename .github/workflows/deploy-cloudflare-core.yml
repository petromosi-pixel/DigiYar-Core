name: Deploy DigiYar V5 Worker

on:
  push:
    branches: [v5]
    paths:
      - 'worker.js'
      - 'js/data-ingestion-v5.1.js'
      - 'js/search-core-v5.1.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-core.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout V5
        uses: actions/checkout@v4
        with:
          ref: v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Wrangler
        run: wrangler --version

      - name: Deploy DigiYar V5 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc
