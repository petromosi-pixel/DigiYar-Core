name: DigiYar V5.1 Catalog Ingestion

on:
  push:
    branches: [v5]
    paths-ignore:
      - 'data/catalog/**'
      - 'js/*-product-index-v5.1.js'
      - 'js/product-index-generated-v5.1.js'
      - 'data/category-registry-v5.1.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5-catalog-ingestion
  cancel-in-progress: true

jobs:
  ingest-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v5
        uses: actions/checkout@v4
        with:
          ref: v5
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build expanded web catalogs
        run: node scripts/catalog-ingest-v5.1.mjs

      - name: Build subcategory-aware catalogs
        run: node scripts/subcategory-ingest-v5.1.mjs

      - name: Resolve TorobShop price and availability
        run: node scripts/torobshop-price-resolver-v5.1.mjs

      - name: Audit generated catalogs
        run: node tests/v5.1-catalog-audit.mjs

      - name: Audit price and availability
        run: node tests/v5.1-price-availability-audit.mjs

      - name: Commit generated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog data/category-registry-v5.1.json js/*-product-index-v5.1.js js/product-index-generated-v5.1.js
          git diff --cached --quiet && exit 0
          git commit -m "data(v5.1): refresh subcategory-aware Iranian product catalogs"
          git pull --rebase origin v5
          git push origin HEAD:v5
