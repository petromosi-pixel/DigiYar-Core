name: DigiYar V5.1 Catalog Ingestion

on:
  push:
    branches: [v5]
    paths-ignore:
      - 'data/catalog/**'
      - 'js/*-product-index-v5.1.js'
      - 'js/product-index-generated-v5.1.js'
      - 'data/category-registry-v5.1.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5-catalog-ingestion
  cancel-in-progress: true

jobs:
  ingest-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v5
        uses: actions/checkout@v4
        with:
          ref: v5
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build expanded web catalogs
        run: node scripts/catalog-ingest-v5.1.mjs

      - name: Build subcategory-aware catalogs
        run: node scripts/subcategory-ingest-v5.1.mjs

      - name: Resolve TorobShop price and availability
        run: node scripts/torobshop-price-resolver-v5.1.mjs

      - name: Rebuild runtime index from resolved catalog
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const categories = ['mobile','laptop-computer','home-appliances','digital','audio-video','fashion','beauty-health','supermarket','sports-travel','tools-industrial','books-stationery','kids-toys','auto'];
          const combined = [];
          for (const category of categories) {
            const data = JSON.parse(await fs.readFile(`data/catalog/${category}.json`, 'utf8'));
            const products = Array.isArray(data.products) ? data.products : [];
            await fs.writeFile(`js/${category}-product-index-v5.1.js`, `export const ${category.toUpperCase().replace(/-/g, '_')}_PRODUCTS = ${JSON.stringify(products, null, 2)};\n`);
            combined.push(...products);
          }
          const meta = JSON.parse(await fs.readFile('data/category-registry-v5.1.json', 'utf8'));
          await fs.writeFile('js/product-index-generated-v5.1.js', `// Rebuilt from resolved catalog data\nexport const PRODUCT_INDEX = ${JSON.stringify(combined, null, 2)};\nexport const INDEX_META = ${JSON.stringify({ generatedAt: new Date().toISOString(), total: combined.length, mode: 'subcategory-aware', categories: meta.categories }, null, 2)};\n`);
          console.log(`RUNTIME_INDEX_TOTAL: ${combined.length}`);
          NODE

      - name: Audit generated catalogs
        run: node tests/v5.1-catalog-audit.mjs

      - name: Audit price and availability
        run: node tests/v5.1-price-availability-audit.mjs

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker with refreshed catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify live Worker after catalog refresh
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              -H 'accept: application/json' \
              'https://digiyar-v5.petromosi.workers.dev/health' \
              | grep -q '"status":"ok"'; then
              echo "Live Worker is ready (attempt ${attempt})."
              exit 0
            fi
            echo "Worker not ready yet (attempt ${attempt}/30); waiting 2s..."
            sleep 2
          done
          echo 'Worker did not become ready after catalog deployment.'
          exit 1

      - name: Commit generated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog data/category-registry-v5.1.json js/*-product-index-v5.1.js js/product-index-generated-v5.1.js
          git diff --cached --quiet && exit 0
          git commit -m "data(v5.1): refresh subcategory-aware Iranian product catalogs"
          git pull --rebase origin v5
          git push origin HEAD:v5