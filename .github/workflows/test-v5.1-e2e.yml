name: V5.1 Full Mission E2E

on:
  push:
    branches:
      - v5
  pull_request:
    branches:
      - v5
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-full-mission-e2e
  cancel-in-progress: true

jobs:
  full-mission-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v5
        uses: actions/checkout@v4
        with:
          ref: v5
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run V5.1 Full Mission E2E
        run: npm run test:v5.1:mission
