<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DigiYar V4 — Conversation Engine Test</title>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    button {
      background: #e6123d;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .test {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .pass {
      color: green;
      font-weight: bold;
    }

    .fail {
      color: #d00;
      font-weight: bold;
    }

    pre {
      background: #f1f1f1;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      direction: ltr;
      text-align: left;
    }

    .summary {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>تست Conversation Engine — V4</h1>

  <div class="subtitle">
    Build 3 — Alpha 1
  </div>

  <button onclick="runTests()">
    اجرای تست‌ها
  </button>

  <div id="summary"></div>

  <div id="results"></div>

</div>

<script src="./js/need-understanding.js"></script>

<script src="./js/question-engine.js"></script>

<script src="./js/conversation-engine.js"></script>

<script>

function runTests() {

  const results = [];

  /* =======================================================
     Test 1
     شروع گفتگو با نیاز ناقص
     ======================================================= */

  try {

    const state =
      DigiYarConversationEngine.start(
        "یه گوشی خوب می‌خوام."
      );

    const pass =
      state.need.category === "mobile" &&
      state.need.budget === null &&
      state.need.usage.length === 0 &&
      state.question.questionId === "budget" &&
      state.status === "waiting_for_answer";

    results.push({
      name: "سناریو ۱ — شروع گفتگو با نیاز ناقص",
      pass: pass,
      output: state
    });

  } catch (error) {

    results.push({
      name: "سناریو ۱ — شروع گفتگو با نیاز ناقص",
      pass: false,
      output: String(error)
    });

  }


  /* =======================================================
     Test 2
     پاسخ به سؤال بودجه
     ======================================================= */

  try {

    let state =
      DigiYarConversationEngine.start(
        "یه گوشی خوب می‌خوام."
      );

    state =
      DigiYarConversationEngine
        .continueConversation(
          state,
          "تا ۱۵ میلیون"
        );

    const pass =
      state.need.budget !== null &&
      state.need.budget.max === 15000000 &&
      state.question.questionId === "usage" &&
      state.status === "waiting_for_answer";

    results.push({
      name: "سناریو ۲ — دریافت بودجه و رفتن به سؤال بعدی",
      pass: pass,
      output: state
    });

  } catch (error) {

    results.push({
      name: "سناریو ۲ — دریافت بودجه و رفتن به سؤال بعدی",
      pass: false,
      output: String(error)
    });

  }


  /* =======================================================
     Test 3
     تکمیل نیاز
     ======================================================= */

  try {

    let state =
      DigiYarConversationEngine.start(
        "یه گوشی خوب می‌خوام."
      );

    state =
      DigiYarConversationEngine
        .continueConversation(
          state,
          "تا ۱۵ میلیون"
        );

    state =
      DigiYarConversationEngine
        .continueConversation(
          state,
          "برای عکاسی"
        );

    const pass =
      state.need.category === "mobile" &&
      state.need.budget !== null &&
      state.need.budget.max === 15000000 &&
      state.need.usage.includes("photography") &&
      state.status === "complete" &&
      state.question.ready === true;

    results.push({
      name: "سناریو ۳ — تکمیل کامل نیاز",
      pass: pass,
      output: state
    });

  } catch (error) {

    results.push({
      name: "سناریو ۳ — تکمیل کامل نیاز",
      pass: false,
      output: String(error)
    });

  }


  /* =======================================================
     Test 4
     نیاز کامل از همان ابتدا
     ======================================================= */

  try {

    const state =
      DigiYarConversationEngine.start(
        "یه گوشی تا ۱۵ میلیون برای عکاسی می‌خوام."
      );

    const pass =
      state.status === "complete" &&
      state.question.ready === true &&
      state.question.question === null;

    results.push({
      name: "سناریو ۴ — نیاز کامل در اولین پیام",
      pass: pass,
      output: state
    });

  } catch (error) {

    results.push({
      name: "سناریو ۴ — نیاز کامل در اولین پیام",
      pass: false,
      output: String(error)
    });

  }


  /* =======================================================
     Test 5
     تاریخچه گفتگو
     ======================================================= */

  try {

    let state =
      DigiYarConversationEngine.start(
        "یه گوشی خوب می‌خوام."
      );

    state =
      DigiYarConversationEngine
        .continueConversation(
          state,
          "تا ۱۵ میلیون"
        );

    state =
      DigiYarConversationEngine
        .continueConversation(
          state,
          "برای عکاسی"
        );

    const pass =
      Array.isArray(state.history) &&
      state.history.length === 3 &&
      state.turn === 3;

    results.push({
      name: "سناریو ۵ — ثبت تاریخچه گفتگو",
      pass: pass,
      output: state
    });

  } catch (error) {

    results.push({
      name: "سناریو ۵ — ثبت تاریخچه گفتگو",
      pass: false,
      output: String(error)
    });

  }


  /* =======================================================
     Render Results
     ======================================================= */

  let passed = 0;

  let html = "";

  results.forEach(function (result) {

    if (result.pass) {
      passed++;
    }

    html += `
      <div class="test">

        <div class="${result.pass ? "pass" : "fail"}">
          ${result.pass ? "✅ PASS" : "❌ FAIL"}
        </div>

        <h3>
          ${result.name}
        </h3>

        <pre>${JSON.stringify(
          result.output,
          null,
          2
        )}</pre>

      </div>
    `;

  });

  const total =
    results.length;

  const summary =
    passed === total
      ? `🎉 ALL TESTS PASSED — ${passed} از ${total}`
      : `⚠️ SOME TESTS FAILED — ${passed} از ${total}`;

  document.getElementById(
    "summary"
  ).innerHTML = summary;

  document.getElementById(
    "results"
  ).innerHTML = html;

}

</script>

</body>

</html>
