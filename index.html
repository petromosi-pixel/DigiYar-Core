<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دیجی‌یار</title>

<style>
body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: white;
    width: 85%;
    max-width: 400px;
    text-align: center;
    padding: 35px 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px #ddd;
}

.logo {
    font-size: 55px;
}

h1 {
    color: #e6123d;
    margin-bottom: 10px;
}

p {
    color: #555;
}

button {
    margin-top: 25px;
    background: #e6123d;
    color: white;
    border: none;
    padding: 15px 35px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}
</style>

<link rel="manifest" href="manifest.json">

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
<body>

<div class="card">

<div class="logo">🛒</div>

<h1>دیجی‌یار</h1>

<p>
دسترسی سریع و آسان به دیجی‌کالا
</p>

<a href="https://aflo.ir/16da7m1UY">
<button>
ورود به دیجی‌کالا
</button>
</a>

</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
