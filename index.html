<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    دیجی‌یار | خرید هوشمند اینترنتی
</title>

<meta
    name="description"
    content="دیجی‌یار؛ دسترسی سریع به فروشگاه‌های محبوب اینترنتی و انتخاب هوشمندانه برای خرید بهتر"
>

<meta
    name="theme-color"
    content="#e6123d"
>

<link
    rel="manifest"
    href="manifest.json"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>

<body>

<header class="header">

<img
    src="assets/logos/logo.png"
    alt="لوگوی دیجی‌یار"
    class="logo"
>

<h1>
    دیجی‌یار
</h1>

<p>
    به دیجی‌یار خوش اومدی؛ همه فروشگاه‌های محبوبت اینجان
</p>

</header>



<main class="container">

<!-- ======================================
     پیشنهاد امروز
======================================= -->

<section class="featured">

    <h2>
        🔥 پیشنهاد امروز دیجی‌یار
    </h2>

    <p>
        خرید عمومی؟ دیجی‌کالا
        <br>
        خرید روزمره؟ اسنپ‌شاپ
    </p>

</section>



<!-- ======================================
     پیشنهاد هوشمند
======================================= -->

<section
    id="smartRecommendation"
    class="smart-recommendation"
    hidden
>

    <h2>
        پیشنهاد هوشمند دیجی‌یار
    </h2>

    <div
        id="recommendationResults"
    ></div>

</section>



<!-- ======================================
     فروشگاه‌ها
======================================= -->

<section class="platform-section">

    <h2>
        فروشگاه‌های محبوب
    </h2>


    <input
        type="text"
        id="searchBox"
        placeholder="🔍 جستجوی فروشگاه..."
        autocomplete="off"
    >


    <div id="platforms"></div>

</section>

</main>



<footer class="footer">

<p>
    © با دیجی‌یار - هوشمندانه انتخاب و آسانتر خرید کن
</p>

</footer>



<!-- =========================================
     Digiyar Core
     ترتیب بارگذاری مهم است
========================================= -->

<script src="js/platforms.js"></script>
<script src="js/user-profile.js"></script>

<script src="js/affiliate-resolver.js"></script>

<script src="js/need-engine.js"></script>
<script src="js/product-catalog.js"></script>
<script src="js/product-scoring.js"></script>
<script src="js/digiyar-engine.js"></script>

<script src="js/app.js"></script>

</body>

</html>
