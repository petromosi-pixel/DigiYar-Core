<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دیجی‌یار</title>

<meta name="description" content="پلتفرم هوشمند برای تجربه بهترین خرید اینترنتی">
<meta name="theme-color" content="#e6123d">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{

    width:90%;
    max-width:420px;

    background:#ffffff;

    border-radius:22px;

    padding:35px 25px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.logo{

    font-size:64px;

    margin-bottom:15px;

}

h1{

    color:#e6123d;

    font-size:36px;

    margin-bottom:12px;

}

p{

    color:#555;

    font-size:18px;

    line-height:1.9;

    margin-bottom:30px;

}

button{

    width:100%;

    background:#e6123d;

    color:#fff;

    border:none;

    border-radius:14px;

    padding:16px;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

}

button:hover{

    opacity:.9;

    transform:scale(1.02);

}

a{

    text-decoration:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">🛒</div>

<h1>دیجی‌یار</h1>

<p>

پلتفرم هوشمند برای تجربه بهترین خرید اینترنتی

</p>

<a href="https://aflo.ir/16da7m1UY">

<button>

ورود به دیجی‌کالا

</button>

</a>

</div>

<script>

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{

navigator.serviceWorker.register('./sw.js')

.then(()=>console.log("Service Worker Registered"))

.catch(err=>console.log(err));

});

}

</script>

</body>

</html>
