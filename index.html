<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دیجی‌یار | خرید هوشمند اینترنتی</title>

    <meta name="description" content="دیجی‌یار؛ دسترسی آسان به فروشگاه‌های محبوب اینترنتی">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/style.css">

    <meta name="theme-color" content="#e6123d">
</head>

<body>

<header class="header">

    <img 
    src="assets/logo.png" 
    alt="لوگوی دیجی‌یار"
    class="logo">

    <h1>دیجی‌یار</h1>

    <p>
        به دیجی‌یار خوش اومدی؛
        همه فروشگاه‌های محبوبت اینجان
    </p>

</header>


<main class="container">


<section class="stores">

<h2>فروشگاه‌ها</h2>


<div class="store-card">

    <img 
    src="assets/digikala.png"
    alt="دیجی‌کالا">

    <div class="store-info">

        <h3>دیجی‌کالا</h3>

        <p>
        بزرگ‌ترین فروشگاه اینترنتی ایران
        </p>

        <a 
        href="#"
        class="store-btn">
        ورود به دیجی‌کالا
        </a>

    </div>

</div>



<div class="store-card">

    <img 
    src="assets/torob.png"
    alt="ترب">

    <div class="store-info">

        <h3>ترب</h3>

        <p>
        مقایسه قیمت هزاران فروشگاه
        </p>

        <a 
        href="#"
        class="store-btn">
        ورود به ترب
        </a>

    </div>

</div>



<div class="store-card">

    <img 
    src="assets/basalam.png"
    alt="باسلام">

    <div class="store-info">

        <h3>باسلام</h3>

        <p>
        بازار محصولات ایرانی
        </p>

        <a 
        href="#"
        class="store-btn">
        ورود به باسلام
        </a>

    </div>

</div>


</section>


</main>



<footer>

<p>
© دیجی‌یار - خرید آسان‌تر، هوشمندتر
</p>

</footer>



<script src="js/app.js"></script>


</body>

</html>
